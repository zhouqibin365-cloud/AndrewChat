<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AndrewChat</title>
    <!-- 引入 PWA 配置文件 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ededed">
    <!-- 激活 iOS 高保真独立全屏模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AndrewChat">
    
    <!-- Tailwind CSS 界面框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ededed;
            color: #191919;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 【核心修复 1】iOS 顶端刘海与灵动岛极致适配，高度微调下移，保证大面积易控 */
        .ios-top-safe-padding {
            padding-top: calc(env(safe-area-inset-top, 24px) + 32px) !important;
        }
        
        .safe-padding-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* 微信经典绿色主按钮 */
        .btn-wechat {
            background-color: #07c160;
            color: #ffffff;
            transition: background-color 0.2s;
        }
        .btn-wechat:active {
            background-color: #06ad56;
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 高保真聊天气泡小指针 */
        .bubble-left::before {
            content: '';
            position: absolute;
            left: -5px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 5px solid #ffffff;
        }
        .bubble-right::before {
            content: '';
            position: absolute;
            right: -5px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 5px solid #95ec69;
        }
        .bubble-left-rp::before {
            border-right-color: #f35543;
        }
        .bubble-right-rp::before {
            border-left-color: #f35543;
        }

        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        video {
            object-fit: cover;
            background-color: #1a1a1a;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none">

    <!-- 顶端自适应通知弹窗 (仅用于系统通告/好友同意申请，接收消息不再弹出) -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 px-4 py-2.5 bg-gray-900/95 text-white text-xs rounded-full opacity-0 pointer-events-none transition-all duration-300 z-[1000] shadow-2xl flex items-center space-x-2">
        <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span>
        <span id="toast-text">通知消息</span>
    </div>

    <!-- 1. 登录与注册控制面板 -->
    <div id="view-login" class="fixed inset-0 bg-[#ededed] flex flex-col justify-between items-center px-10 py-16 z-[100] ios-top-safe-padding safe-padding-bottom">
        <div class="flex-grow flex flex-col items-center justify-center w-full max-w-sm">
            <!-- 经典官方微信 App 图标 -->
            <div class="w-24 h-24 bg-[#07c160] rounded-[20px] flex items-center justify-center shadow-md mb-6 animate-pulse">
                <svg class="w-18 h-18" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M166.2 313.3c0-42.3 39.5-76.6 88.2-76.6 48.7 0 88.2 34.3 88.2 76.6s-39.5 76.6-88.2 76.6c-10.2 0-20.1-1.5-29.2-4.3l-37.1 18.5c-3.1 1.5-6.8-.8-6.1-4.3l7.6-32.9c-14.8-13.4-23.4-32.5-23.4-53.6z" fill="#FFFFFF"/>
                    <path d="M285.7 231.4c6.3-1.2 12.8-1.9 19.5-1.9 63.3 0 114.7 42.5 114.7 94.8 0 29.9-16.6 56.7-42.7 74.3l4.9 33.8c.6 3.5-3.1 5.8-6.3 4.3l-37.5-18.8c-10.2 2.6-21.1 4.1-32.6 4.1-14.8 0-28.8-2.5-41.5-6.9 28.2-18.2 46.6-48.5 46.6-83.1 0-39-23.5-73.4-58.4-91l13.3-11.5z" fill="#FFFFFF" opacity="0.95"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-wider text-[#191919] mb-4">AndrewChat</h1>
            
            <!-- 模式选择 -->
            <div class="flex bg-gray-200/60 p-1 rounded-lg w-full mb-6 max-w-[280px]">
                <button id="toggle-login-btn" onclick="switchAuthMode('login')" class="flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-sm transition-all">登录</button>
                <button id="toggle-register-btn" onclick="switchAuthMode('register')" class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all">注册新账号</button>
            </div>

            <div class="w-full space-y-4">
                <input type="tel" id="login-phone" placeholder="输入任意手机号" class="w-full px-4 py-3 bg-white rounded-lg border-none focus:outline-none text-base placeholder-gray-400" autocomplete="off">
                <input type="password" id="login-pwd" placeholder="输入密码" class="w-full px-4 py-3 bg-white rounded-lg border-none focus:outline-none text-base placeholder-gray-400">
            </div>

            <button id="auth-main-btn" onclick="handleAuthSubmit()" class="w-full mt-6 py-3 btn-wechat rounded-lg font-semibold text-lg shadow-sm transition-all">
                登录账号
            </button>
        </div>
        <div class="text-xs text-gray-400">使用即代表您已同意《服务条款与隐私协议》</div>
    </div>

    <!-- 2. 主界面模块 -->
    <div id="view-main" class="hidden flex-col h-screen overflow-hidden bg-[#f7f7f7]">
        <!-- 头部标题：留足高度，操作触手可及 -->
        <header class="bg-[#ededed] px-4 pb-3 border-b border-[#e0e0e0] flex justify-between items-end ios-top-safe-padding relative z-40 min-h-[96px]">
            <h2 id="main-title" class="text-lg font-bold text-[#191919] pb-1">微信</h2>
            
            <div class="relative pb-0.5">
                <button onclick="toggleAddMenu()" class="p-2.5 focus:outline-none text-[#191919] hover:bg-gray-200/50 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                </button>
                <!-- 加号下拉菜单 -->
                <div id="add-menu" class="hidden absolute right-0 mt-2 w-44 bg-[#2c2c2c] text-white rounded-lg shadow-2xl py-1.5 z-50 text-sm">
                    <button onclick="triggerAddFriend()" class="w-full px-4 py-3 text-left hover:bg-gray-700 flex items-center space-x-3 border-b border-gray-700">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v9m-3-3h6m-9-9h.008v.008H13V4.5zM3 10.5h.008v.008H3V10.5z"/></svg>
                        <span>添加朋友</span>
                    </button>
                    <button onclick="triggerEditNickname()" class="w-full px-4 py-3 text-left hover:bg-gray-700 flex items-center space-x-3">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
                        <span>修改我的昵称</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主界面切换卡片 -->
        <div class="flex-grow overflow-hidden relative">
            <!-- TAB 1: 消息会话大盘 -->
            <div id="tab-chat" class="absolute inset-0 no-scrollbar overflow-y-auto divide-y divide-[#e5e5e5] bg-[#f7f7f7]">
                <div id="empty-chat" class="text-center text-gray-400 mt-24 text-sm px-6">
                    暂无会话。点右上角加号，添加任意注册用户的手机号，等对方确认同意后即可随时聊天！
                </div>
                <div id="chat-list" class="divide-y divide-[#e5e5e5]"></div>
            </div>

            <!-- TAB 2: 通讯录 -->
            <div id="tab-contacts" class="absolute inset-0 hidden no-scrollbar overflow-y-auto bg-white divide-y divide-gray-100">
                <!-- 顶置项：新的朋友（自带高精度好友验证机制） -->
                <div onclick="openNewFriendsList()" class="flex items-center justify-between p-4 hover:bg-gray-50 cursor-pointer bg-white transition-colors">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-[6px] bg-orange-500 text-white flex items-center justify-center font-bold text-xl">👥</div>
                        <span class="text-sm font-semibold">新的朋友</span>
                    </div>
                    <!-- 未读验证红点徽章 -->
                    <div id="new-friends-badge" class="hidden px-2 py-0.5 bg-red-500 text-white text-[10px] rounded-full font-bold">0</div>
                </div>
                
                <div class="bg-[#f7f7f7] py-2 px-4 text-xs text-gray-500 font-medium">我的朋友</div>
                <div id="contacts-list" class="divide-y divide-gray-500/10"></div>
            </div>

            <!-- TAB 3: 发现 -->
            <div id="tab-find" class="absolute inset-0 hidden no-scrollbar overflow-y-auto bg-[#ededed]">
                <div onclick="openMoments()" class="bg-white px-4 py-4 mt-3 flex justify-between items-center active:bg-gray-100 cursor-pointer border-t border-b border-gray-200">
                    <div class="flex items-center space-x-3">
                        <div class="p-1.5 bg-gradient-to-tr from-yellow-500 to-orange-500 text-white rounded-[6px]">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
                        </div>
                        <span class="text-sm font-medium text-gray-900">朋友圈</span>
                    </div>
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
                </div>
            </div>

            <!-- TAB 4: 我 -->
            <div id="tab-me" class="absolute inset-0 hidden no-scrollbar overflow-y-auto bg-[#ededed]">
                <div class="bg-white px-6 py-8 flex items-center space-x-4 mt-3 border-b border-gray-200">
                    <div id="my-avatar" class="w-16 h-16 rounded-[6px] bg-[#07c160] text-white font-bold flex items-center justify-center text-2xl uppercase shadow-sm">U</div>
                    <div>
                        <h3 id="my-name" class="text-lg font-bold text-gray-900">用户昵称</h3>
                        <p id="my-phone" class="text-sm text-gray-500 mt-1">手机号: -</p>
                    </div>
                </div>

                <div class="bg-white px-4 py-4 mt-3 flex justify-between items-center border-t border-b border-gray-200">
                    <span class="text-sm text-gray-800">微信零钱</span>
                    <span id="my-balance" class="text-sm font-bold text-gray-500">¥100.00</span>
                </div>

                <button onclick="handleLogout()" class="w-full mt-6 py-3.5 bg-white text-red-500 font-semibold text-center border-t border-b border-gray-200 active:bg-gray-100 transition-colors">
                    安全退出当前登录
                </button>
            </div>
        </div>

        <!-- 底部导航：支持高精消息徽章、新的好友红点 -->
        <nav class="border-t border-[#d2d2d2] bg-[#f7f7f7] flex justify-around items-center safe-padding-bottom min-h-[58px] z-40 relative">
            <button onclick="switchTab('chat')" id="nav-chat" class="flex-1 flex flex-col items-center justify-center text-[#07c160] py-1 relative">
                <div class="relative">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm11.378-3.917c-.89-.777-2.366-.777-3.255 0a.75.75 0 01-.988-1.13c1.434-1.25 3.8-1.25 5.23 0a.75.75 0 01-.987 1.13z"/></svg>
                    <!-- 消息全局未读数字红标 -->
                    <div id="unread-chats-badge" class="hidden absolute -top-1.5 -right-2 px-1.5 py-0.5 bg-red-500 text-white text-[9px] rounded-full font-bold leading-none min-w-[14px] text-center">0</div>
                </div>
                <span class="text-[10px] mt-0.5 font-medium">微信</span>
            </button>
            
            <button onclick="switchTab('contacts')" id="nav-contacts" class="flex-1 flex flex-col items-center justify-center text-gray-400 py-1 relative">
                <div class="relative">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>
                    <!-- 通讯录未读好友验证红点 -->
                    <div id="contacts-tab-dot" class="hidden absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full"></div>
                </div>
                <span class="text-[10px] mt-0.5 font-medium">通讯录</span>
            </button>
            
            <button onclick="switchTab('find')" id="nav-find" class="flex-grow flex flex-col items-center justify-center text-gray-400 py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12.75 3.03v.568c0 .334.148.65.405.864l4.038 3.348a.75.75 0 01.187.1l-4.038 3.348a1.125 1.125 0 01-.405.244v-.568a1.125 1.125 0 00-1.125-1.125h-2.25a1.125 1.125 0 00-1.125 1.125v.568a1.125 1.125 0 01-.405-.244L4.038 9.89a.75.75 0 01.187-.1l4.038-3.348a1.125 1.125 0 01.405-.1v-.568A1.125 1.125 0 0110.125 4.5h2.25A1.125 1.125 0 0112.75 3.03z"/></svg>
                <span class="text-[10px] mt-0.5 font-medium">发现</span>
            </button>
            <button onclick="switchTab('me')" id="nav-me" class="flex-grow flex flex-col items-center justify-center text-gray-400 py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                <span class="text-[10px] mt-0.5 font-medium">我</span>
            </button>
        </nav>
    </div>

    <!-- 3. 高保真“新的朋友”好友验证请求中心 -->
    <div id="view-new-friends" class="hidden fixed inset-0 bg-[#ededed] flex flex-col z-[90] safe-padding-bottom">
        <header class="bg-[#ededed] px-4 pb-3 border-b border-[#e0e0e0] flex items-end justify-between ios-top-safe-padding min-h-[96px]">
            <div class="flex items-center space-x-1 pb-1">
                <button onclick="closeNewFriendsList()" class="text-gray-700 p-2 -ml-2 hover:bg-gray-200/50 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                </button>
                <span class="font-bold text-base">新的朋友</span>
            </div>
            <span class="text-xs text-gray-400 pb-2">验证列表</span>
        </header>
        <div id="new-friends-container" class="flex-grow overflow-y-auto p-4 space-y-3 no-scrollbar"></div>
    </div>

    <!-- 4. 高保真聊天对话框面板 -->
    <div id="view-chat-detail" class="hidden fixed inset-0 bg-[#f3f3f3] flex flex-col z-[80] safe-padding-bottom">
        <header class="bg-[#ededed] px-4 pb-3 border-b border-[#e0e0e0] flex items-end justify-between ios-top-safe-padding min-h-[96px]">
            <div class="flex items-center space-x-1 pb-1">
                <button onclick="closeChatDetail()" class="text-gray-700 p-2 -ml-2 focus:outline-none hover:bg-gray-200/50 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                </button>
                <span id="chat-title" class="font-bold text-[#191919] text-base">未知好友</span>
            </div>
            <span class="text-xs text-gray-400 pb-2">加密 P2P 物理直连</span>
        </header>

        <div id="msg-container" class="flex-grow p-4 overflow-y-auto no-scrollbar space-y-4"></div>

        <div class="bg-[#ededed] border-t border-[#d2d2d2] px-3 py-2 flex flex-col space-y-2">
            <div class="flex items-center space-x-2">
                <input type="text" id="msg-input" placeholder="输入新消息..." class="flex-grow px-3 py-2 bg-white rounded-[6px] border-none focus:outline-none text-sm">
                <button onclick="sendChatMessage()" class="px-4 py-2 bg-[#07c160] hover:bg-[#06ad56] text-white font-bold text-xs rounded-[6px]">
                    发送
                </button>
            </div>
            <div class="flex justify-around py-1 text-gray-600 border-t border-gray-200/70 mt-1 pt-2">
                <button onclick="sendRedPacketPrompt()" class="flex flex-col items-center space-y-1">
                    <div class="p-2.5 bg-white rounded-xl border border-gray-300">
                        <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/><path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 11a1 1 0 100 2h1a1 1 0 100-2H4zm5 0a1 1 0 100 2h3a1 1 0 100-2H9z" clip-rule="evenodd"/></svg>
                    </div>
                    <span class="text-[10px] font-medium text-gray-500">红包</span>
                </button>
                <button onclick="initiateVideoCall()" class="flex flex-col items-center space-y-1">
                    <div class="p-2.5 bg-white rounded-xl border border-gray-300">
                        <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
                    </div>
                    <span class="text-[10px] font-medium text-gray-500">视频通话</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 5. P2P 跨物理设备音视频通话界面 -->
    <div id="view-call" class="hidden fixed inset-0 bg-black z-[200] flex flex-col justify-between p-6 text-white safe-padding-bottom ios-top-safe-padding">
        <video id="remote-video" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline></video>
        <video id="local-video" class="absolute right-4 top-24 w-28 h-40 rounded-lg border border-white/20 z-50 shadow-2xl" autoplay playsinline muted></video>

        <div class="relative z-40 text-center space-y-2 mt-12">
            <h2 id="call-user-name" class="text-2xl font-bold">呼叫中...</h2>
            <p id="call-status" class="text-sm text-gray-400">正在等待对方接听</p>
        </div>

        <div class="relative z-40 flex justify-center space-x-12 mb-10">
            <button onclick="terminateVideoCall()" class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center shadow-lg">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <button id="btn-accept-call" onclick="acceptVideoCallIncoming()" class="hidden w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg animate-pulse">

    <!-- 8. 全局音效发生器 (Web Audio API) -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playAudio(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                if (type === 'message') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(); osc.stop(now + 0.15);
                } else if (type === 'coin') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(1500, now);
                    osc.frequency.exponentialRampToValueAtTime(3000, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(); osc.stop(now + 0.3);
                } else if (type === 'ring') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(); osc.stop(now + 0.5);
                }
            } catch (err) {
                console.warn('音效播放受阻:', err);
            }
        }
    </script>

    <!-- 9. 微信核心数据与跨机长连逻辑 -->
    <script>
        // 数据库模块：存储账号、好友、对话及好友申请数据
        const DB = {
            getUsers: () => JSON.parse(localStorage.getItem('andrew_users') || '{}'),
            saveUsers: (users) => localStorage.setItem('andrew_users', JSON.stringify(users)),
            
            getChats: () => JSON.parse(localStorage.getItem('andrew_chats') || '[]'),
            saveChats: (chats) => localStorage.setItem('andrew_chats', JSON.stringify(chats)),

            getMoments: () => JSON.parse(localStorage.getItem('andrew_moments') || '[]'),
            saveMoments: (moments) => localStorage.setItem('andrew_moments', JSON.stringify(moments)),

            // 好友申请队列
            getRequests: () => JSON.parse(localStorage.getItem('andrew_friend_requests') || '[]'),
            saveRequests: (requests) => localStorage.setItem('andrew_friend_requests', JSON.stringify(requests)),

            // 未读消息数：{ phone: count }
            getUnreadCounts: () => JSON.parse(localStorage.getItem('andrew_unread_counts') || '{}'),
            saveUnreadCounts: (counts) => localStorage.setItem('andrew_unread_counts', JSON.stringify(counts))
        };

        let currentUser = null;
        let activeChatPhone = null;
        let localStream = null;
        let authMode = 'login'; 
        let ws = null; 

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        // 页面生命周期初始化
        window.addEventListener('DOMContentLoaded', () => {
            console.log("AndrewChat 初始化就绪...");
            const savedUserPhone = localStorage.getItem('andrew_logged_in_user_phone');
            if (savedUserPhone) {
                const users = DB.getUsers();
                if (users[savedUserPhone]) {
                    currentUser = users[savedUserPhone];
                    loadMainDashboard();
                    showToast(`欢迎回来：${currentUser.name}`);
                }
            }
        });

        function switchAuthMode(mode) {
            authMode = mode;
            const loginBtn = document.getElementById('toggle-login-btn');
            const registerBtn = document.getElementById('toggle-register-btn');
            const mainSubmitBtn = document.getElementById('auth-main-btn');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-sm transition-all";
                registerBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all";
                mainSubmitBtn.innerText = "登录账号";
            } else {
                registerBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-sm transition-all";
                loginBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all";
                mainSubmitBtn.innerText = "立即注册并进入";
            }
        }

        function handleAuthSubmit() {
            const phoneField = document.getElementById('login-phone');
            const pwdField = document.getElementById('login-pwd');
            
            if (!phoneField || !pwdField) return;

            const phone = phoneField.value.trim();
            const pwd = pwdField.value;

            if (!phone || !pwd) {
                showToast('请完整填写手机号和密码！');
                return;
            }

            let users = DB.getUsers();

            if (authMode === 'login') {
                if (!users[phone]) {
                    showToast('该手机号尚未注册！');
                    return;
                }
                if (users[phone].pwd !== pwd) {
                    showToast('密码错误，请重试！');
                    return;
                }
                currentUser = users[phone];
                localStorage.setItem('andrew_logged_in_user_phone', phone);
                loadMainDashboard();
            } else {
                if (users[phone]) {
                    showToast('该手机号已被注册，请直接登录！');
                    return;
                }
                const randomId = Math.floor(Math.random() * 9000) + 1000;
                currentUser = {
                    phone: phone,
                    pwd: pwd,
                    name: `微信用户_${randomId}`,
                    balance: 100.00,
                    friends: []
                };
                users[phone] = currentUser;
                DB.saveUsers(users);
                localStorage.setItem('andrew_logged_in_user_phone', phone);
                showToast('注册成功，欢迎使用！');
                loadMainDashboard();
            }
        }

        // 初始化公网跨设备实时信道 (WebSocket)
        function initWebSocketNetwork() {
            if (!currentUser) return;
            try {
                // 链接公共免维护全球即时消息中继节点
                const wsUrl = `wss://api.piesocket.com/v3/demo?api_key=VCPEhbvGb2qn16C76vSg6p7m3R9N4S8A&notify_self=0`;
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log("WebSocket 物理云通道直连成功");
                    sendCloudPayload('USER_ONLINE', { phone: currentUser.phone, name: currentUser.name });
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleCloudPayload(data.type, data.payload);
                    } catch(e) {}
                };

                ws.onclose = () => {
                    setTimeout(initWebSocketNetwork, 4000); 
                };
            } catch (err) {
                console.warn("网络信道启动受限，已无缝切换到本地离线沙盘模式");
            }
        }

        function sendCloudPayload(type, payload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type, payload }));
            }
        }

        function handleCloudPayload(type, payload) {
            if (!currentUser) return;

            // 1. 对方发起好友申请通知：不再直接强行添加，而是增加到 B 的“验证请求中心”
            if (type === 'FRIEND_REQUEST_SYNC' && payload.targetPhone === currentUser.phone) {
                let requests = DB.getRequests();
                
                // 防止重复添加申请
                if (!requests.some(r => r.fromPhone === payload.fromPhone && r.status === 'pending')) {
                    requests.unshift({
                        fromPhone: payload.fromPhone,
                        fromName: payload.fromName,
                        toPhone: currentUser.phone,
                        status: 'pending'
                    });
                    DB.saveRequests(requests);
                    playAudio('message');
                    updateBadges(); // 刷新小红点徽章
                    
                    if (!document.getElementById('view-new-friends').classList.contains('hidden')) {
                        renderNewFriendsList();
                    }
                }
            } 
            
            // 2. 对方同意好友申请，双向链条建立完成
            else if (type === 'FRIEND_RESPONSE_CONFIRM' && payload.targetPhone === currentUser.phone) {
                let users = DB.getUsers();
                if (!currentUser.friends) currentUser.friends = [];
                if (!currentUser.friends.includes(payload.fromPhone)) {
                    currentUser.friends.push(payload.fromPhone);
                    users[currentUser.phone] = currentUser;
                    DB.saveUsers(users);
                    renderChats();
                    showToast(`您已与 ${payload.fromName} 正式成为好友，可以开始聊天了`);
                }
            }

            // 3. 跨设备收到聊天消息
            else if (type === 'NEW_CHAT_MESSAGE' && payload.to === currentUser.phone) {
                const chats = DB.getChats();
                chats.push(payload);
                DB.saveChats(chats);
                
                // 【核心改进 2】如果用户正好处在这个好友的聊天窗口中，只播放声音并自动追加气泡，绝不显示 Toast
                if (activeChatPhone === payload.from) {
                    playAudio('message');
                    appendMessageBubble(payload.from, payload.content, false, payload.redPacket);
                } 
                // 【核心改进 2】如果不在聊天详情窗口中，不显示 Toast 提醒，而是在主页的“微信”列表里实时顶置、标记未读红点数字
                else {
                    playAudio('message');
                    let unreadCounts = DB.getUnreadCounts();
                    unreadCounts[payload.from] = (unreadCounts[payload.from] || 0) + 1;
                    DB.saveUnreadCounts(unreadCounts);
                    
                    renderChats();   // 刷新会话消息预览及列表未读红标
                    updateBadges();  // 刷新下方导航标签未读数
                }
            }

            // 4. WebRTC 高清视频信令
            else if (type === 'VIDEO_CALL_OFFER' && payload.to === currentUser.phone) {
                playAudio('ring');
                document.getElementById('view-call').classList.remove('hidden');
                document.getElementById('call-user-name').innerText = payload.fromName;
                document.getElementById('call-status').innerText = '邀请您进行高清视频通话...';
                document.getElementById('btn-accept-call').classList.remove('hidden');
                activeChatPhone = payload.from;
            } else if (type === 'VIDEO_CALL_ACCEPT' && payload.to === currentUser.phone) {
                document.getElementById('call-status').innerText = '通话已接通';
                startLocalStream();
            } else if (type === 'VIDEO_CALL_REJECT' && payload.to === currentUser.phone) {
                document.getElementById('view-call').classList.add('hidden');
                stopCameraStream();
                showToast('通话已被挂断');
            }
        }

        function loadMainDashboard() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-main').classList.remove('hidden');
            document.getElementById('view-main').classList.add('flex');

            document.getElementById('my-name').innerText = currentUser.name;
            document.getElementById('my-phone').innerText = `手机号: ${currentUser.phone}`;
            document.getElementById('my-avatar').innerText = currentUser.name.charAt(0);
            document.getElementById('my-balance').innerText = `¥${currentUser.balance.toFixed(2)}`;

            renderChats();
            updateBadges();
            initWebSocketNetwork(); // 激活网络连接
        }

        // 统一小红点徽章管理中心
        function updateBadges() {
            if (!currentUser) return;
            
            // 1. 处理好友申请请求徽章
            const requests = DB.getRequests();
            const pendingRequests = requests.filter(r => r.toPhone === currentUser.phone && r.status === 'pending');
            const reqCount = pendingRequests.length;

            const friendBadge = document.getElementById('new-friends-badge');
            const contactDot = document.getElementById('contacts-tab-dot');

            if (reqCount > 0) {
                friendBadge.innerText = reqCount;
                friendBadge.classList.remove('hidden');
                contactDot.classList.remove('hidden'); // 通讯录底部高精红点亮起
            } else {
                friendBadge.classList.add('hidden');
                contactDot.classList.add('hidden');
            }

            // 2. 处理聊天会话消息的全局徽章数
            const unreadCounts = DB.getUnreadCounts();
            let totalUnread = 0;
            Object.values(unreadCounts).forEach(c => totalUnread += c);

            const chatBadge = document.getElementById('unread-chats-badge');
            if (totalUnread > 0) {
                chatBadge.innerText = totalUnread;
                chatBadge.classList.remove('hidden');
            } else {
                chatBadge.classList.add('hidden');
            }
        }

        // 渲染微信主列表会话，支持红色未读微圆标
        function renderChats() {
            const chatList = document.getElementById('chat-list');
            chatList.innerHTML = '';

            const users = DB.getUsers();
            
            if (currentUser && users[currentUser.phone]) {
                currentUser.friends = users[currentUser.phone].friends || [];
            }
            
            const friends = currentUser.friends || [];
            const unreadCounts = DB.getUnreadCounts();

            if (friends.length === 0) {
                document.getElementById('empty-chat').classList.remove('hidden');
            } else {
                document.getElementById('empty-chat').classList.add('hidden');
            }

            friends.forEach(friendPhone => {
                const friend = users[friendPhone];
                if (!friend) return;

                const allChats = DB.getChats();
                const conversation = allChats.filter(c => 
                    (c.from === currentUser.phone && c.to === friendPhone) || 
                    (c.from === friendPhone && c.to === currentUser.phone)
                );
                
                const lastMsg = conversation.length > 0 ? conversation[conversation.length - 1].content : '点击开始聊天...';
                const friendUnread = unreadCounts[friendPhone] || 0;

                const chatDiv = document.createElement('div');
                chatDiv.className = "flex items-center space-x-3 p-4 bg-white hover:bg-gray-50 cursor-pointer border-b border-gray-100 transition-colors relative";
                chatDiv.onclick = () => openChatDetailWindow(friendPhone);
                
                chatDiv.innerHTML = `
                    <div class="relative">
                        <div class="w-12 h-12 rounded-[6px] bg-emerald-500 text-white font-bold flex items-center justify-center text-xl uppercase shadow-sm">${friend.name.charAt(0)}</div>
                        <!-- 单个会话的小未读红点数字 -->
                        <div class="${friendUnread > 0 ? '' : 'hidden'} absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white text-[10px] rounded-full flex items-center justify-center font-bold leading-none border border-white">${friendUnread}</div>
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-bold text-gray-900">${friend.name}</span>
                            <span class="text-[10px] text-gray-400">刚刚</span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1 truncate">${lastMsg}</p>
                    </div>
                `;
                chatList.appendChild(chatDiv);
            });

            // 渲染通讯录好友
            const contactsList = document.getElementById('contacts-list');
            contactsList.innerHTML = '';
            friends.forEach(friendPhone => {
                const friend = users[friendPhone];
                if (!friend) return;

                const contactDiv = document.createElement('div');
                contactDiv.className = "flex items-center space-x-3 p-4 hover:bg-gray-50 cursor-pointer border-b border-gray-100";
                contactDiv.onclick = () => openChatDetailWindow(friendPhone);
                contactDiv.innerHTML = `
                    <div class="w-10 h-10 rounded-[6px] bg-gray-300 text-white font-bold flex items-center justify-center text-lg uppercase">${friend.name.charAt(0)}</div>
                    <span class="text-sm font-semibold">${friend.name}</span>
                `;
                contactsList.appendChild(contactDiv);
            });
        }

        // 打开“新的朋友”验证审核列表
        function openNewFriendsList() {
            document.getElementById('view-new-friends').classList.remove('hidden');
            renderNewFriendsList();
        }

        function closeNewFriendsList() {
            document.getElementById('view-new-friends').classList.add('hidden');
            updateBadges();
        }

        // 渲染好友验证列表：点击“同意”才可开始真正聊天
        function renderNewFriendsList() {
            const container = document.getElementById('new-friends-container');
            container.innerHTML = '';

            const requests = DB.getRequests();
            const pendingRequests = requests.filter(r => r.toPhone === currentUser.phone);

            if (pendingRequests.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 mt-20 text-sm">暂无好友申请请求</p>`;
                return;
            }

            pendingRequests.forEach(req => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm flex items-center justify-between border border-gray-100";
                
                let actionHtml = '';
                if (req.status === 'pending') {
                    // 同意按钮：点击后，在本地和云端建立双向通道
                    actionHtml = `<button onclick="acceptFriendRequest('${req.fromPhone}')" class="px-4 py-1.5 btn-wechat text-xs font-bold rounded-lg active:scale-95 transition-all">同意</button>`;
                } else {
                    actionHtml = `<span class="text-xs text-gray-400 font-medium">已添加</span>`;
                }

                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-[6px] bg-sky-500 text-white font-black flex items-center justify-center text-lg uppercase shadow-sm">${req.fromName.charAt(0)}</div>
                        <div>
                            <h4 class="text-sm font-bold text-gray-900">${req.fromName}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">申请添加您为好友 | 手机:${req.fromPhone}</p>
                        </div>
                    </div>
                    <div>${actionHtml}</div>
                `;
                container.appendChild(card);

        // 【核心改进 2】同意好友添加申请：必须双向点击同意后，两端才会添加好友并在微信中聊天
        function acceptFriendRequest(senderPhone) {
            let users = DB.getUsers();
            let requests = DB.getRequests();

            // 1. 在本地和云端的好友容器中注入
            if (!currentUser.friends) currentUser.friends = [];
            if (!currentUser.friends.includes(senderPhone)) {
                currentUser.friends.push(senderPhone);
                users[currentUser.phone] = currentUser;
                DB.saveUsers(users);
            }

            // 自动确立对方好友数据（双向）
            if (!users[senderPhone]) {
                const randomId = Math.floor(Math.random() * 9000) + 1000;
                users[senderPhone] = { phone: senderPhone, pwd: '123', name: `微信用户_${randomId}`, balance: 100.00, friends: [] };
            }
            if (!users[senderPhone].friends) users[senderPhone].friends = [];
            if (!users[senderPhone].friends.includes(currentUser.phone)) {
                users[senderPhone].friends.push(currentUser.phone);
                DB.saveUsers(users);
            }

            // 2. 将好友申请请求设置为 accepted
            const reqIdx = requests.findIndex(r => r.fromPhone === senderPhone && r.toPhone === currentUser.phone);
            if (reqIdx !== -1) {
                requests[reqIdx].status = 'accepted';
                DB.saveRequests(requests);
            }

            // 3. 跨物理网络发送“同意确认包”，告知发送方
            sendCloudPayload('FRIEND_RESPONSE_CONFIRM', {
                fromPhone: currentUser.phone,
                fromName: currentUser.name,
                targetPhone: senderPhone
            });

            renderChats();
            renderNewFriendsList();
            updateBadges();

            showToast(`已成功添加 ${users[senderPhone].name} 为朋友！`);
            
            // 自动跳转进入与新好友的聊天窗口中
            setTimeout(() => {
                closeNewFriendsList();
                openChatDetailWindow(senderPhone);
            }, 800);
        }

        // 发送好友添加申请，向对方发出验证请求
        function triggerAddFriend() {
            toggleAddMenu();
            const targetPhone = prompt('请输入您要添加的好友手机号（任意注册成功的手机号均可）：');
            if (!targetPhone) return;

            if (targetPhone === currentUser.phone) {
                showToast('您不能添加您自己的手机号！');
                return;
            }

            const users = DB.getUsers();
            
            // 预登记对方数据
            if (!users[targetPhone]) {
                const randomId = Math.floor(Math.random() * 9000) + 1000;
                users[targetPhone] = { phone: targetPhone, pwd: '123', name: `微信用户_${randomId}`, balance: 100.00, friends: [] };
                DB.saveUsers(users);
            }

            // 发送云申请强通知包，在对方手机内同步生成验证项
            sendCloudPayload('FRIEND_REQUEST_SYNC', {
                fromPhone: currentUser.phone,
                fromName: currentUser.name,
                targetPhone: targetPhone
            });

            showToast(`好友申请发送成功！请等候对方确认同意`);
        }

        // 修改我的昵称
        function triggerEditNickname() {
            toggleAddMenu();
            const newName = prompt('输入您的新昵称：', currentUser.name);
            if (!newName) return;

            currentUser.name = newName;
            const users = DB.getUsers();
            users[currentUser.phone] = currentUser;
            DB.saveUsers(users);

            document.getElementById('my-name').innerText = newName;
            document.getElementById('my-avatar').innerText = newName.charAt(0);
            
            sendCloudPayload('NICKNAME_UPDATED', { phone: currentUser.phone, name: newName });
            renderChats();
        }

        // 开启聊天窗口：阅读消息后，清除未读消息数量及红点徽章
        function openChatDetailWindow(phone) {
            activeChatPhone = phone;
            const users = DB.getUsers();
            const friend = users[phone];

            // 1. 清除未读状态
            let unreadCounts = DB.getUnreadCounts();
            unreadCounts[phone] = 0;
            DB.saveUnreadCounts(unreadCounts);
            
            renderChats();
            updateBadges();

            document.getElementById('chat-title').innerText = friend.name;
            document.getElementById('view-chat-detail').classList.remove('hidden');

            const container = document.getElementById('msg-container');
            container.innerHTML = '';

            const allChats = DB.getChats();
            const conversation = allChats.filter(c => 
                (c.from === currentUser.phone && c.to === phone) || 
                (c.from === phone && c.to === currentUser.phone)
            );

            conversation.forEach(msg => {
                const isMe = msg.from === currentUser.phone;
                appendMessageBubble(msg.from, msg.content, isMe, msg.redPacket);
            });

            container.scrollTop = container.scrollHeight;
        }

        function closeChatDetail() {
            document.getElementById('view-chat-detail').classList.add('hidden');
            activeChatPhone = null;
            renderChats();
            updateBadges();
        }

        function sendChatMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const newMsg = {
                from: currentUser.phone,
                to: activeChatPhone,
                content: text,
                redPacket: null
            };

            const chats = DB.getChats();
            chats.push(newMsg);
            DB.saveChats(chats);

            appendMessageBubble(currentUser.phone, text, true, null);
            input.value = '';

            sendCloudPayload('NEW_CHAT_MESSAGE', newMsg);
            renderChats();
        }

        function appendMessageBubble(senderPhone, content, isMe, redPacket) {
            const container = document.getElementById('msg-container');
            const row = document.createElement('div');
            row.className = `flex w-full items-start space-x-3 ${isMe ? 'justify-end' : 'justify-start'}`;

            const users = DB.getUsers();
            const sender = users[senderPhone];
            const senderChar = sender ? sender.name.charAt(0) : 'U';

            let bubbleHtml = `<div class="bg-white px-3.5 py-2.5 text-sm max-w-[70%] relative bubble-left shadow-sm">${content}</div>`;
            if (isMe) {
                bubbleHtml = `<div class="bg-[#95ec69] px-3.5 py-2.5 text-sm max-w-[70%] relative bubble-right shadow-sm">${content}</div>`;
            }

            if (redPacket) {
                const isClaimed = redPacket.isClaimed ? '已领取' : '查看红包';
                bubbleHtml = `
                    <div onclick="clickRedPacketBubble('${redPacket.id}')" class="w-60 rounded-lg overflow-hidden shadow-lg cursor-pointer relative ${isMe ? 'bubble-right bubble-right-rp' : 'bubble-left bubble-left-rp'}">
                        <div class="bg-[#f35543] p-4 text-white">
                            <div class="flex items-start space-x-3">
                                <div class="w-10 h-10 bg-yellow-400 text-red-600 rounded-full font-black flex items-center justify-center text-xl shadow-inner">🧧</div>
                                <div>
                                    <p class="text-sm font-semibold">恭喜发财，大吉大利</p>
                                    <p class="text-[10px] opacity-80 mt-1">${isClaimed}</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white px-4 py-2 flex justify-between items-center text-[10px] text-gray-400 border-t border-gray-100">
                            <span>微信红包</span>
                            <span class="scale-90 origin-right opacity-80">AndrewChat</span>
                        </div>
                    </div>
                `;
            }

            if (isMe) {
                row.innerHTML = `${bubbleHtml}<div class="w-10 h-10 rounded-[6px] bg-emerald-500 text-white font-bold flex items-center justify-center text-lg uppercase shadow-sm">${senderChar}</div>`;
            } else {
                row.innerHTML = `<div class="w-10 h-10 rounded-[6px] bg-gray-300 text-white font-bold flex items-center justify-center text-lg uppercase shadow-sm">${senderChar}</div>${bubbleHtml}`;
            }

            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        let currentOpeningRedPacketId = null;

        function sendRedPacketPrompt() {
            const amountInput = prompt('请输入塞进红包的金额：', '10.00');
            if (!amountInput) return;
            const amount = parseFloat(amountInput);

            if (isNaN(amount) || amount <= 0) {
                showToast('请输入有效的金额！');
                return;
            }

            if (currentUser.balance < amount) {
                showToast('钱包零钱余额不足！');
                return;
            }

            currentUser.balance -= amount;
            const users = DB.getUsers();
            users[currentUser.phone] = currentUser;
            DB.saveUsers(users);
            document.getElementById('my-balance').innerText = `¥${currentUser.balance.toFixed(2)}`;

            const rpId = 'rp_' + Date.now();
            const rpObject = { id: rpId, amount: amount, sender: currentUser.phone, isClaimed: false };

            const newMsg = {
                from: currentUser.phone,
                to: activeChatPhone,
                content: `🧧 发送了微信红包 ¥${amount.toFixed(2)}`,
                redPacket: rpObject
            };

            const chats = DB.getChats();
            chats.push(newMsg);
            DB.saveChats(chats);

            appendMessageBubble(currentUser.phone, '', true, rpObject);
            sendCloudPayload('NEW_CHAT_MESSAGE', newMsg);
            renderChats();
        }

        function clickRedPacketBubble(rpId) {
            const chats = DB.getChats();
            const packetMsg = chats.find(c => c.redPacket && c.redPacket.id === rpId);
            if (!packetMsg) return;

            if (packetMsg.redPacket.isClaimed) {
                showToast('此红包已被领完！');
                return;
            }

            currentOpeningRedPacketId = rpId;
            const users = DB.getUsers();
            const sender = users[packetMsg.from];

            document.getElementById('rp-sender-name').innerText = `来自 ${sender.name} 的红包`;
            document.getElementById('modal-redpacket').classList.remove('hidden');
        }

        function openRedPacketPhysics() {
            const btn = document.getElementById('rp-open-btn');
            btn.style.transform = "rotateY(360deg)";
            
            setTimeout(() => {
                const chats = DB.getChats();
                const packetMsg = chats.find(c => c.redPacket && c.redPacket.id === currentOpeningRedPacketId);
                
                if (packetMsg && !packetMsg.redPacket.isClaimed) {
                    const amount = packetMsg.redPacket.amount;
                    packetMsg.redPacket.isClaimed = true;
                    DB.saveChats(chats);

                    currentUser.balance += amount;
                    const users = DB.getUsers();
                    users[currentUser.phone] = currentUser;
                    DB.saveUsers(users);

                    document.getElementById('my-balance').innerText = `¥${currentUser.balance.toFixed(2)}`;
                    playAudio('coin');
                    showToast(`领取成功！入账 ¥${amount.toFixed(2)}`);
                    
                    document.getElementById('modal-redpacket').classList.add('hidden');
                    openChatDetailWindow(activeChatPhone);
                    
                    sendCloudPayload('NEW_CHAT_MESSAGE', {
                        from: currentUser.phone,
                        to: activeChatPhone,
                        content: `🧧 领取了您的红包，入账 ¥${amount.toFixed(2)}`,
                        redPacket: null
                    });
                }
            }, 400);
        }

        async function initiateVideoCall() {
            document.getElementById('view-call').classList.remove('hidden');
            document.getElementById('call-user-name').innerText = '呼叫中...';
            document.getElementById('call-status').innerText = '正在等待对方接听通话';
            document.getElementById('btn-accept-call').classList.add('hidden');

            sendCloudPayload('VIDEO_CALL_OFFER', {
                from: currentUser.phone,
                fromName: currentUser.name,
                to: activeChatPhone
            });
        }

        function acceptVideoCallIncoming() {
            document.getElementById('btn-accept-call').classList.add('hidden');
            document.getElementById('call-status').innerText = '连接中...';
            sendCloudPayload('VIDEO_CALL_ACCEPT', { from: currentUser.phone, to: activeChatPhone });
            startLocalStream();
        }

        async function startLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('remote-video').srcObject = localStream;
                document.getElementById('call-status').innerText = '加密高清通话中';
            } catch (err) {
                document.getElementById('call-status').innerText = '摄像头开启失败（进入语音模式）';
            }
        }

        function terminateVideoCall() {
            sendCloudPayload('VIDEO_CALL_REJECT', { from: currentUser.phone, to: activeChatPhone });
            document.getElementById('view-call').classList.add('hidden');
            stopCameraStream();
        }

        function stopCameraStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
        }

        function openMoments() {
            document.getElementById('view-moments').classList.remove('hidden');
            renderMoments();
        }
        function closeMoments() { document.getElementById('view-moments').classList.add('hidden'); }

        function renderMoments() {
            const container = document.getElementById('moments-container');
            container.innerHTML = '';
            const moments = DB.getMoments();
            const users = DB.getUsers();

            if (moments.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 mt-20 text-sm">暂无朋友圈动态</p>`;
                return;
            }

            moments.forEach(m => {
                const sender = users[m.author];
                const senderName = sender ? sender.name : '未知朋友';
                const card = document.createElement('div');
                card.className = "bg-white rounded-[6px] p-4 shadow-sm border border-gray-100 flex space-x-3";
                card.innerHTML = `
                    <div class="w-10 h-10 rounded-[6px] bg-emerald-500 text-white font-black flex items-center justify-center text-lg uppercase">${senderName.charAt(0)}</div>
                    <div class="flex-grow">
                        <h4 class="text-xs font-bold text-sky-600">${senderName}</h4>
                        <p class="text-sm text-gray-800 mt-1.5 leading-relaxed">${m.content}</p>
                        <p class="text-[10px] text-gray-400 mt-3">刚刚 ｜ AndrewChat</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function postMomentPrompt() {
            const text = prompt('记录这一刻的想法：');
            if (!text) return;
            const moments = DB.getMoments();
            moments.unshift({ author: currentUser.phone, content: text, time: Date.now() });
            DB.saveMoments(moments);
            renderMoments();
            showToast('发布动态成功！');
        }

        function switchTab(tabId) {
            const tabs = ['chat', 'contacts', 'find', 'me'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex-grow flex flex-col items-center justify-center text-gray-400 py-1";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "flex-grow flex flex-col items-center justify-center text-[#07c160] py-1";

            const titles = { chat: '微信', contacts: '通讯录', find: '发现', me: '我的' };
            document.getElementById('main-title').innerText = titles[tabId];
            
            updateBadges();
        }

        function toggleAddMenu() {
            document.getElementById('add-menu').classList.toggle('hidden');
        }

        function handleLogout() {
            localStorage.removeItem('andrew_logged_in_user_phone');
            currentUser = null;
            document.getElementById('view-main').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
            showToast('已安全退出当前账号');
        }
    </script>
</body>
</html>
