<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微信 WeChat PWA</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ededed">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f7;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 红包旋转动画 */
        @keyframes rotate-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        .animate-spin-coin {
            animation: rotate-coin 1s linear infinite;
        }
        /* 模拟微信绿 */
        .wx-green {
            background-color: #07c160;
        }
        .text-wx-green {
            color: #07c160;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between overflow-hidden">

    <!-- 1. 登录注册页面 (Auth View) -->

        <div class="mt-20 text-center">
            <div class="w-20 h-20 bg-[#07c160] rounded-2xl mx-auto flex items-center justify-center shadow-md">

            </div>

            <p class="text-sm text-gray-500 mt-1">跨端极速互通聊天系统</p>
        </div>

        <div class="space-y-4 max-w-sm mx-auto w-full mb-20">
            <div class="bg-white rounded-lg p-1.5 flex items-center border border-gray-200">
                <span class="px-3 text-gray-500 text-sm border-r border-gray-100">+86</span>
                <input type="tel" id="auth-phone" placeholder="请输入手机号" class="flex-grow p-2 text-sm focus:outline-none" value="">
            </div>
            <div class="bg-white rounded-lg p-1.5 flex items-center border border-gray-200">

            </div>
            
            <div class="flex gap-4 pt-2">

            </div>
            <p class="text-xs text-center text-gray-400">本地离线数据保存在当前浏览器，支持跨标签多开互通</p>
        </div>

        <!-- 内容滚动区 (四大 Tab 页面) -->

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 纯代码合成音效管理器
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let ringtoneInterval = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'message') {
                // 微信新消息提示音 (清脆急促)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                // 拆红包的金币叮当声
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.setValueAtTime(1600, now + 0.08);
                osc.frequency.setValueAtTime(2000, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'ringtone-start') {
                // 开启视频来电循环铃声
                if (ringtoneInterval) return;
                ringtoneInterval = setInterval(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    // 经典的微信电话嘟嘟音
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }, 1000);
            } else if (type === 'ringtone-stop') {
                if (ringtoneInterval) {
                    clearInterval(ringtoneInterval);
                    ringtoneInterval = null;
                }
            }
        }

        function getChatList() {
            if (!currentUser) return [];
            const messages = db.getMessages();
            const groups = db.getGroups();
            const users = db.getUsers();

            const list = [];
            
            // 1. 查找和个人的聊天（只要有消息发生）
            const chatPartners = new Set();
            messages.forEach(msg => {
                if (!msg.isGroup) {
                    if (msg.sender === currentUser.phone) chatPartners.add(msg.receiver);
                    if (msg.receiver === currentUser.phone) chatPartners.add(msg.sender);
                }
            });

            // 如果没消息但有默认好友，也默认拉入聊天会话列表
            if (currentUser.friends) {
                currentUser.friends.forEach(f => chatPartners.add(f));
            }

            chatPartners.forEach(phone => {
                const partner = users[phone];
                if (partner) {
                    const sessionMsgs = messages.filter(m => !m.isGroup && ((m.sender === currentUser.phone && m.receiver === phone) || (m.sender === phone && m.receiver === currentUser.phone)));
                    const lastMsg = sessionMsgs[sessionMsgs.length - 1];
                    list.push({
                        id: phone,
                        name: partner.name,
                        lastText: lastMsg ? (lastMsg.type === 'redpacket' ? '[微信红包]' : lastMsg.content) : '暂无消息',
                        time: lastMsg ? new Date(lastMsg.time).toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'}) : '',
                        isGroup: false,
                        rawTime: lastMsg ? lastMsg.time : 0
                    });
                }
            });

            // 2. 查找我加入的群聊
            groups.forEach(g => {
                if (g.members.includes(currentUser.phone)) {
                    const groupMsgs = messages.filter(m => m.isGroup && m.receiver === g.id);
                    const lastMsg = groupMsgs[groupMsgs.length - 1];
                    list.push({
                        id: g.id,
                        name: g.name,
                        lastText: lastMsg ? `${lastMsg.senderName}: ${lastMsg.type === 'redpacket' ? '[微信红包]' : lastMsg.content}` : '新创建的群聊',
                        time: lastMsg ? new Date(lastMsg.time).toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'}) : '',
                        isGroup: true,
                        rawTime: lastMsg ? lastMsg.time : 1
                    });
                }
            });

            // 排序：最新消息在最上方
            return list.sort((a,b) => b.rawTime - a.rawTime);
        }

            const detailView = document.getElementById('rp-detail-view');

            if (alreadyOpened) {
                const record = msg.extra.detail.find(d => d.phone === currentUser.phone);
                document.getElementById('rp-detail-amount').innerText = '¥ ' + Number(record.amount).toFixed(2);
                openBtn.classList.add('hidden');
                detailView.classList.remove('hidden');
            } else {
                openBtn.classList.remove('hidden');
                detailView.classList.add('hidden');
                // 绑定点击事件，处理旋转动画并结算
                openBtn.onclick = () => performOpenRedPacket(msgId);
            }

            document.getElementById('open-redpacket-overlay').classList.remove('hidden');
        }

        function closeOpenRedPacketOverlay() {
            document.getElementById('open-redpacket-overlay').classList.add('hidden');
            const openBtn = document.getElementById('rp-open-btn');
            openBtn.classList.remove('animate-spin-coin');
            pendingRedPacketMsgId = null;
        }

        // 拆红包拆开计算过程
        function performOpenRedPacket(msgId) {
            const openBtn = document.getElementById('rp-open-btn');
            openBtn.classList.add('animate-spin-coin'); // 添加旋转动画效果

            setTimeout(() => {
                const messages = db.getMessages();
                const msg = messages.find(m => m.id === msgId);
                if (!msg || !msg.extra) return;

                if (msg.extra.remainCount <= 0) {
                    showToast('手慢了，红包已被领完！');
                    closeOpenRedPacketOverlay();
                    return;
                }

                // 计算随机手气红包金额
                let grabAmount = 0;
                if (msg.extra.remainCount === 1) {
                    grabAmount = msg.extra.remainAmount;
                } else {
                    // 二倍均值法随机红包算法
                    const max = (msg.extra.remainAmount / msg.extra.remainCount) * 2;
                    grabAmount = Math.random() * max;
                    if (grabAmount < 0.01) grabAmount = 0.01;
                    grabAmount = Math.round(grabAmount * 100) / 100;
                }

                // 更新红包数据状态
                msg.extra.remainAmount = Math.round((msg.extra.remainAmount - grabAmount) * 100) / 100;
                msg.extra.remainCount -= 1;
                msg.extra.openedBy.push(currentUser.phone);
                msg.extra.detail.push({ phone: currentUser.phone, name: currentUser.name, amount: grabAmount });
                
                db.setMessages(messages);

                // 给我的钱包塞入抢红包金额
                currentUser.balance = Number(currentUser.balance) + grabAmount;
                const users = db.getUsers();
                users[currentUser.phone] = currentUser;
                db.setUsers(users);

                // 播放清脆硬币铃声
                playSound('coin');

                // 渲染拆开后金额界面
                openBtn.classList.add('hidden');
                document.getElementById('rp-detail-amount').innerText = '¥ ' + grabAmount.toFixed(2);
                document.getElementById('rp-detail-view').classList.remove('hidden');
                
                loadMePage();
                loadMessages();
            }, 1000);
        }

        // ======================= 微信视频通话机制 (P2P 模拟) =======================
        let localStream = null;

        async function startVideoCall() {
            if (activeChatSession === '13800000001') {
                // 如果是机器人，直接开启极客仿真通话
                document.getElementById('video-caller-name').innerText = '张伟 (智能助手)';
                document.getElementById('video-call-status').innerText = '视频来电连接建立中...';
                document.getElementById('video-call-overlay').classList.remove('hidden');
                playSound('ringtone-start');

                // 开启我的本地摄像头渲染
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('local-video').srcObject = localStream;
                } catch (e) {
                    showToast('未检测到本地摄像头，已启用静态仿真画面。');
                }

                // 模拟对方在 1.5 秒后接听
                setTimeout(() => {
                    playSound('ringtone-stop');
                    document.getElementById('video-call-status').innerText = '视频连接成功 [通话中 00:01]';
                    document.getElementById('remote-video-placeholder').classList.remove('bg-emerald-500/20');
                    document.getElementById('remote-video-placeholder').classList.add('bg-wx-green');
                    document.getElementById('remote-video-placeholder').innerText = '张';
                    showToast('通话建立成功');
                }, 2000);
            } else {
                // 真实同机跨标签页呼叫！利用 localStorage 状态总线
                const callState = {
                    caller: currentUser.phone,
                    receiver: activeChatSession,
                    status: 'ringing', // ringing, connected, hungup
                    time: Date.now()
                };
                db.setCallState(callState);
                
                document.getElementById('video-caller-name').innerText = activeChatSession;
                document.getElementById('video-call-status').innerText = '正在呼叫对方，请在另一台浏览器窗口接听...';
                document.getElementById('video-call-overlay').classList.remove('hidden');
                playSound('ringtone-start');

                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('local-video').srcObject = localStream;
                } catch (e) {}
            }
        }

        // 监听并轮询/同步跨标签通话来电
        function checkAndNotifyCall() {
            const call = db.getCallState();
            if (!call || call.status === 'hungup') {
                if (!document.getElementById('video-call-overlay').classList.contains('hidden')) {
                    hangupVideoCall();
                }
                return;
            }

            // 被叫方发现有来电响铃
            if (call.receiver === currentUser.phone && call.status === 'ringing') {
                playSound('ringtone-start');
                document.getElementById('video-caller-name').innerText = call.caller;
                document.getElementById('video-call-status').innerText = '邀请你进行视频通话...';
                document.getElementById('video-accept-btn').classList.remove('hidden'); // 显示接受按钮
                document.getElementById('video-call-overlay').classList.remove('hidden');
            }

            // 呼叫方发现对方已接听
            if (call.caller === currentUser.phone && call.status === 'connected') {
                playSound('ringtone-stop');
                document.getElementById('video-call-status').innerText = '视频连接成功，本地测试完美通话中';
            }
        }

        function acceptVideoCall() {
            const call = db.getCallState();
            if (call) {
                call.status = 'connected';
                db.setCallState(call);
                
                playSound('ringtone-stop');
                document.getElementById('video-accept-btn').classList.add('hidden');
                document.getElementById('video-call-status').innerText = '视频连接成功，本地测试完美通话中';

                // 开启接听方的摄像头
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = localStream;
                }).catch(e => {});
            }
        }

        function hangupVideoCall() {
            playSound('ringtone-stop');
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('local-video').srcObject = null;
            document.getElementById('video-call-overlay').classList.add('hidden');
            document.getElementById('video-accept-btn').classList.add('hidden');

            const call = db.getCallState();
            if (call && call.status !== 'hungup') {
                call.status = 'hungup';
                db.setCallState(call);
            }
        }

        // ======================= 微信发现页 & 朋友圈机制 =======================
        function openMoments() {
            document.getElementById('moments-badge').classList.add('hidden');
            document.getElementById('moments-view').classList.remove('hidden');
            loadMoments();
        }

        function closeMoments() {
            document.getElementById('moments-view').classList.add('hidden');
        }

        function loadMoments() {
            const container = document.getElementById('moments-list');
            container.innerHTML = '';
            const moments = db.getMoments();

            moments.forEach(m => {
                const card = document.createElement('div');
                card.className = "py-4 flex space-x-3";
                
                const liked = m.likes.includes(currentUser.phone);
                
                let commentSection = '';
                if (m.comments.length > 0) {
                    commentSection = `
                        <div class="mt-2 bg-gray-50 rounded p-2 text-xs text-gray-600 space-y-1">
                            ${m.comments.map(c => `<div><span class="font-semibold text-blue-600">${c.name}:</span> ${c.text}</div>`).join('')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="w-10 h-10 rounded-lg bg-gray-300 flex items-center justify-center text-white font-bold shrink-0">${m.name.charAt(0)}</div>
                    <div class="flex-grow space-y-1.5">
                        <span class="text-xs font-bold text-blue-600 block">${m.name}</span>
                        <p class="text-xs text-gray-800 leading-relaxed">${m.text}</p>
                        
                        <!-- 点赞互动栏 -->
                        <div class="flex justify-between items-center text-[10px] text-gray-400">
                            <span>${new Date(m.timestamp).toLocaleDateString()}</span>
                            <div class="flex space-x-4">
                                <button onclick="likeMoment('${m.id}')" class="flex items-center space-x-1 ${liked ? 'text-red-500 font-semibold' : 'hover:text-blue-500'}">
                                    <i data-lucide="heart" class="w-3 h-3"></i> 
                                    <span>${liked ? '已赞' : '点赞'} (${m.likes.length})</span>
                                </button>
                                <button onclick="commentMomentModal('${m.id}')" class="flex items-center space-x-1 hover:text-blue-500">
                                    <i data-lucide="message-circle" class="w-3 h-3"></i>
                                    <span>评论</span>
                                </button>
                            </div>
                        </div>
                        ${commentSection}
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function likeMoment(momentId) {
            const moments = db.getMoments();
            const moment = moments.find(m => m.id === momentId);
            if (moment) {
                const idx = moment.likes.indexOf(currentUser.phone);
                if (idx > -1) {
                    moment.likes.splice(idx, 1);
                } else {
                    moment.likes.push(currentUser.phone);
                }
                db.setMoments(moments);
                loadMoments();
            }
        }

        function commentMomentModal(momentId) {
            const text = prompt('请输入评论内容：');
            if (!text || !text.trim()) return;
            const moments = db.getMoments();
            const moment = moments.find(m => m.id === momentId);
            if (moment) {
                moment.comments.push({
                    phone: currentUser.phone,
                    name: currentUser.name,
                    text: text.trim()
                });
                db.setMoments(moments);
                loadMoments();
            }
        }

        function openPublishMomentModal() {
            document.getElementById('publish-moment-modal').classList.remove('hidden');
        }

        function closePublishMomentModal() {
            document.getElementById('publish-moment-modal').classList.add('hidden');
            document.getElementById('moment-text-input').value = '';
        }

        function submitPublishMoment() {
            const text = document.getElementById('moment-text-input').value.trim();
            if (!text) return showToast('不能发布空白动态');

            const moments = db.getMoments();
            const newMoment = {
                id: 'mom_' + Date.now(),
                phone: currentUser.phone,
                name: currentUser.name,
                text: text,
                timestamp: Date.now(),
                likes: [],
                comments: []
            };

            moments.unshift(newMoment); // 最新发布的排在最前面
            db.setMoments(moments);
            closePublishMomentModal();
            loadMoments();
            showToast('朋友圈动态发布成功');
        }

        // ======================= 加好友 & 建群功能 =======================
        function toggleAddFriendModal() {
            document.getElementById('add-friend-modal').classList.toggle('hidden');
        }

        function submitAddFriend() {
            const phone = document.getElementById('search-phone').value.trim();
            if (!phone) return;
            const users = db.getUsers();
            
            if (!users[phone]) return showToast('未找到该手机号的用户');
            if (phone === currentUser.phone) return showToast('不能添加自己为好友');

            if (!currentUser.friends) currentUser.friends = [];
            if (currentUser.friends.includes(phone)) return showToast('你们已经是好友了');

            currentUser.friends.push(phone);
            users[currentUser.phone] = currentUser;
            
            // 对方也默认添加我
            if (!users[phone].friends) users[phone].friends = [];
            users[phone].friends.push(currentUser.phone);
            
            db.setUsers(users);
            toggleAddFriendModal();
            loadContactsTab();
            showToast('好友添加成功！');
        }

        function loadContactsTab() {
            const cList = document.getElementById('contact-list');
            cList.innerHTML = '';
            const users = db.getUsers();

            if (currentUser.friends && currentUser.friends.length > 0) {
                currentUser.friends.forEach(fPhone => {
                    const friend = users[fPhone];
                    if (friend) {
                        const div = document.createElement('div');
                        div.className = "flex items-center space-x-3 p-3 bg-white border-b border-gray-50 cursor-pointer hover:bg-gray-50";
                        div.onclick = () => openChatWindow(fPhone, false);
                        div.innerHTML = `
                            <div class="w-9 h-9 bg-gray-400 rounded-lg flex items-center justify-center text-white font-bold text-xs">
                                ${friend.name.charAt(0)}
                            </div>
                            <span class="text-sm font-semibold text-gray-800">${friend.name}</span>
                        `;
                        cList.appendChild(div);
                    }
                });
            } else {
                cList.innerHTML = `<div class="p-4 text-center text-gray-400 text-xs">暂无好友</div>`;
            }

            // 加载我的群聊
            const gList = document.getElementById('group-list');
            gList.innerHTML = '';
            const groups = db.getGroups();
            const myGroups = groups.filter(g => g.members.includes(currentUser.phone));

            if (myGroups.length > 0) {
                myGroups.forEach(g => {
                    const div = document.createElement('div');
                    div.className = "flex items-center space-x-3 p-3 bg-white border-b border-gray-50 cursor-pointer hover:bg-gray-50";
                    div.onclick = () => openChatWindow(g.id, true);
                    div.innerHTML = `
                        <div class="w-9 h-9 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold text-xs">
                            ${g.name.charAt(0)}
                        </div>
                        <span class="text-sm font-semibold text-gray-800">${g.name} (${g.members.length}人)</span>
                    `;
                    gList.appendChild(div);
                });
            } else {
                gList.innerHTML = `<div class="p-4 text-center text-gray-400 text-xs">暂无群聊</div>`;
            }
        }

        function toggleCreateGroupModal() {
            const modal = document.getElementById('create-group-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                // 渲染好友多选框
                const container = document.getElementById('group-friends-checkbox');
                container.innerHTML = '';
                const users = db.getUsers();
                if (currentUser.friends) {
                    currentUser.friends.forEach(fPhone => {
                        const friend = users[fPhone];
                        if (friend) {
                            const div = document.createElement('label');
                            div.className = "flex items-center space-x-2 p-1 text-xs cursor-pointer";
                            div.innerHTML = `
                                <input type="checkbox" value="${fPhone}" class="rounded text-wx-green">
                                <span>${friend.name}</span>
                            `;
                            container.appendChild(div);
                        }
                    });
                }
            }
        }

        function submitCreateGroup() {
            const name = document.getElementById('group-name-input').value.trim() || '微信新群聊';
            const checkboxes = document.querySelectorAll('#group-friends-checkbox input:checked');
            const members = [currentUser.phone];
            checkboxes.forEach(cb => members.push(cb.value));

            if (members.length < 2) return showToast('群聊除您自己外至少包含1位好友');

            const groups = db.getGroups();
            const newGroup = {
                id: 'group_' + Date.now(),
                name: name,
                members: members,
                creator: currentUser.phone
            };

            groups.push(newGroup);
            db.setGroups(groups);
            toggleCreateGroupModal();
            loadContactsTab();
            showToast(`成功创建群聊【${name}】`);
        }

        function showGroupMembers(groupId) {
            const groups = db.getGroups();
            const group = groups.find(g => g.id === groupId);
            if (group) {
                const users = db.getUsers();
                const names = group.members.map(p => users[p] ? users[p].name : p).join(', ');
                alert(`群成员列表：\n${names}`);
            }
        }

        // ======================= 跨标签页本地事件大同步（核心同步引擎） =======================
        window.addEventListener('storage', (e) => {
            // 每当 localStorage 有更新（说明在另一个无痕窗口发送了消息、发了朋友圈、或者呼叫了通话）
            if (e.key === 'wx_sync_trigger') {
                // 刷新主账号的内部对象，确保数据最新
                if (currentUser) {
                    const users = db.getUsers();
                    if (users[currentUser.phone]) {
                        currentUser = users[currentUser.phone];
                    }
                }
                
                // 实时重绘 UI
                loadChatsTab();
                loadContactsTab();
                loadMessages();
                loadMoments();
                checkAndNotifyCall();
                
                // 新朋友圈badge红点提示
                if (activeTab !== 'discover') {
                    document.getElementById('moments-badge').classList.remove('hidden');
                }
            }
        });

        // 默认检测登录状态
        checkLoginState();
    </script>
</body>
