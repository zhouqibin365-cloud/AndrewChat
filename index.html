<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AndrewChat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #ededed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        /* 顶部安全区域 */
        .safe-area-top { padding-top: env(safe-area-inset-top, 20px); }
        .bubble-left { position: relative; border-radius: 6px; background: white; }
        .bubble-left::before { content: ''; position: absolute; left: -6px; top: 10px; border: 5px solid transparent; border-right-color: #fff; }
        .bubble-right { position: relative; border-radius: 6px; background: #95ec69; }
        .bubble-right::before { content: ''; position: absolute; right: -6px; top: 10px; border: 5px solid transparent; border-left-color: #95ec69; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 登录注册页 -->
    <div id="view-login" class="fixed inset-0 bg-[#ededed] z-50 flex flex-col items-center justify-center p-6">
        <div class="w-20 h-20 bg-[#07c160] rounded-[6px] flex items-center justify-center mb-10 shadow-md">
            <span class="text-white text-4xl font-bold">A</span>
        </div>
        <div class="w-full max-w-xs space-y-4">
            <input type="tel" id="input-phone" placeholder="手机号" class="w-full p-4 rounded-lg bg-white border-none outline-none">
            <input type="password" id="input-pwd" placeholder="密码" class="w-full p-4 rounded-lg bg-white border-none outline-none">
            <div class="flex gap-4 pt-4">
                <button onclick="handleAuth('login')" class="flex-1 bg-[#07c160] text-white py-3 rounded-lg font-bold">登录</button>
                <button onclick="handleAuth('register')" class="flex-1 bg-white text-[#07c160] py-3 rounded-lg font-bold border border-[#07c160]">注册</button>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="view-main" class="hidden flex-col h-full bg-[#ededed]">
        <header class="safe-area-top bg-[#ededed] px-4 py-3 flex justify-between items-center border-b border-[#dcdcdc] relative">
            <h2 id="main-title" class="text-lg font-bold">微信</h2>
            <button onclick="alert('添加朋友功能')" class="p-2 -mr-2 text-[#191919]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            </button>
        </header>
        
        <div class="flex-grow overflow-y-auto bg-[#f7f7f7]" id="tab-container">
            <div id="chat-list" class="divide-y divide-gray-100 bg-white"></div>
        </div>

        <nav class="h-14 border-t border-[#dcdcdc] bg-[#f7f7f7] flex justify-around items-center text-gray-500 text-xs">
            <button onclick="switchTab('chat', '微信')" class="flex flex-col items-center text-[#07c160]">
                <span class="text-xl">💬</span>微信
            </button>
            <button onclick="switchTab('contacts', '通讯录')" class="flex flex-col items-center">
                <span class="text-xl">👥</span>通讯录
            </button>
            <button onclick="switchTab('me', '我')" class="flex flex-col items-center">
                <span class="text-xl">👤</span>我
            </button>
        </nav>
    </div>

    <script>
        const DB = {
            users: JSON.parse(localStorage.getItem('wx_users') || '{}'),
            save() { localStorage.setItem('wx_users', JSON.stringify(this.users)); }
        };

        function handleAuth(type) {
            const phone = document.getElementById('input-phone').value;
            const pwd = document.getElementById('input-pwd').value;
            if(!phone || !pwd) return alert('请输入手机号和密码');

            if (type === 'register') {
                if(DB.users[phone]) return alert('该手机号已注册');
                DB.users[phone] = { phone, pwd, name: '用户' + phone.slice(-4) };
                DB.save();
                alert('注册成功，请使用该账号登录');
            } else {
                if(!DB.users[phone] || DB.users[phone].pwd !== pwd) return alert('账号或密码错误');
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-main').classList.remove('hidden');
                document.getElementById('view-main').classList.add('flex');
                renderChats();
            }
        }

        function renderChats() {
            const list = document.getElementById('chat-list');
            list.innerHTML = Object.values(DB.users).map(u => `
                <div class="flex items-center p-3 gap-3">
                    <div class="w-12 h-12 bg-gray-300 rounded-[6px]"></div>
                    <div class="flex-1">
                        <div class="font-bold text-sm">${u.name}</div>
                        <div class="text-xs text-gray-400">点击进入聊天</div>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(id, title) {
            document.getElementById('main-title').innerText = title;
        }
    </script>
</body>
</html>
