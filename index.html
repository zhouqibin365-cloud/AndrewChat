<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AndrewChat</title>
    <!-- 引入 PWA 配置文件 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ededed">
    <!-- 激活 iOS 高保真独立全屏模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AndrewChat">
    
    <!-- Tailwind CSS 界面框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ededed;
            color: #191919;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* iOS 顶部刘海屏与灵动岛双重防呆保护，留足状态栏空间 */
        .ios-top-safe-padding {
            padding-top: calc(env(safe-area-inset-top, 24px) + 32px) !important;
        }
        
        .safe-padding-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* 微信经典绿色主按钮 */
        .btn-wechat {
            background-color: #07c160;
            color: #ffffff;
            transition: background-color 0.2s;
        }
        .btn-wechat:active {
            background-color: #06ad56;
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 高保真聊天气泡小指针 */
        .bubble-left::before {
            content: '';
            position: absolute;
            left: -5px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 5px solid #ffffff;
        }
        .bubble-right::before {
            content: '';
            position: absolute;
            right: -5px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 5px solid #95ec69;
        }
        .bubble-left-rp::before {
            border-right-color: #f35543;
        }
        .bubble-right-rp::before {
            border-left-color: #f35543;
        }

        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        video {
            object-fit: cover;
            background-color: #1a1a1a;
        }
    </style>

    <script>
        // 如果3.2秒内未加载完毕，无论什么原因直接强制解锁隐藏加载层，启动本地备用自愈网格
        setTimeout(function() {
            var loader = document.getElementById('loading-layer');
            if (loader && !loader.classList.contains('hidden')) {
                console.warn("🛡️ 安全限时阀解锁：启动降级互联协议。");
                loader.classList.add('hidden');
                if (window.forceActivateMockMode) {
                    window.forceActivateMockMode();
                }
            }
        }, 2200);
    </script>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none">

    <!-- 全局防死锁云初始化加载层 -->
    <div id="loading-layer" class="fixed inset-0 bg-[#ededed] z-[2000] flex flex-col items-center justify-center space-y-4">
        <div class="relative w-12 h-12">
            <div class="absolute inset-0 rounded-full border-4 border-[#07c160]/20"></div>
            <div class="absolute inset-0 rounded-full border-4 border-[#07c160] border-t-transparent animate-spin"></div>
        </div>
        <p class="text-sm font-bold text-gray-500 tracking-wide">正在连入 AndrewChat 云端极智信道...</p>
    </div>

    <!-- 顶端自适应消息横幅通知栏 -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 px-4 py-2.5 bg-gray-900/95 text-white text-xs rounded-full opacity-0 pointer-events-none transition-all duration-300 z-[1000] shadow-2xl flex items-center space-x-2">
        <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span>
        <span id="toast-text">通知消息</span>
    </div>

    <div id="view-login" class="fixed inset-0 bg-[#ededed] flex flex-col justify-between items-center px-10 py-16 z-[100] ios-top-safe-padding safe-padding-bottom">
        <div class="flex-grow flex flex-col items-center justify-center w-full max-w-sm">
            <div class="w-24 h-24 bg-[#07c160] rounded-[20px] flex items-center justify-center shadow-md mb-6">
                <svg class="w-18 h-18" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M166.2 313.3c0-42.3 39.5-76.6 88.2-76.6 48.7 0 88.2 34.3 88.2 76.6s-39.5 76.6-88.2 76.6c-10.2 0-20.1-1.5-29.2-4.3l-37.1 18.5c-3.1 1.5-6.8-.8-6.1-4.3l7.6-32.9c-14.8-13.4-23.4-32.5-23.4-53.6z" fill="#FFFFFF"/>
                    <path d="M285.7 231.4c6.3-1.2 12.8-1.9 19.5-1.9 63.3 0 114.7 42.5 114.7 94.8 0 29.9-16.6 56.7-42.7 74.3l4.9 33.8c.6 3.5-3.1 5.8-6.3 4.3l-37.5-18.8c-10.2 2.6-21.1 4.1-32.6 4.1-14.8 0-28.8-2.5-41.5-6.9 28.2-18.2 46.6-48.5 46.6-83.1 0-39-23.5-73.4-58.4-91l13.3-11.5z" fill="#FFFFFF" opacity="0.95"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold tracking-wider text-[#191919] mb-4">AndrewChat</h1>
            
            <div class="flex bg-gray-200/60 p-1 rounded-lg w-full mb-6 max-w-[280px]">
                <button id="toggle-login-btn" onclick="switchAuthMode('login')" class="flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-sm transition-all">登录</button>
                <button id="toggle-register-btn" onclick="switchAuthMode('register')" class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all">注册新账号</button>
            </div>

            <div class="w-full space-y-4">
                <input type="tel" id="login-phone" placeholder="手机号/账号" class="w-full px-4 py-3 bg-white rounded-lg border-none focus:outline-none text-base placeholder-gray-400" autocomplete="off">
                <input type="password" id="login-pwd" placeholder="密码" class="w-full px-4 py-3 bg-white rounded-lg border-none focus:outline-none text-base placeholder-gray-400">
            </div>

            <button id="auth-main-btn" onclick="handleAuthSubmit()" class="w-full mt-6 py-3 btn-wechat rounded-lg font-semibold text-lg shadow-sm transition-all">
                登录账号
            </button>
        </div>
        <div class="text-xs text-gray-400">使用即代表您已同意《服务条款与隐私协议》</div>
    </div>

    <!-- 2. 主界面模块 -->
    <div id="view-main" class="hidden flex-col h-screen overflow-hidden bg-[#f7f7f7]">
        <header class="bg-[#ededed] px-4 pb-3 border-b border-[#e0e0e0] flex justify-between items-end ios-top-safe-padding relative z-40 min-h-[96px]">
            <div class="flex flex-col items-start pb-1">
                <h2 id="main-title" class="text-lg font-bold text-[#191919]">微信</h2>
                <span id="network-status" class="text-[9px] bg-emerald-500/10 text-emerald-600 font-bold px-1.5 py-0.5 rounded-full mt-0.5">检测信道中...</span>
            </div>
            
            <div class="relative pb-0.5">
                <button onclick="toggleAddMenu()" class="p-2.5 focus:outline-none text-[#191919] hover:bg-gray-200/50 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                </button>
                <div id="add-menu" class="hidden absolute right-0 mt-2 w-44 bg-[#2c2c2c] text-white rounded-lg shadow-2xl py-1.5 z-50 text-sm animate-fade-in">
                    <button onclick="triggerAddFriend()" class="w-full px-4 py-3 text-left hover:bg-gray-700 flex items-center space-x-3 border-b border-gray-700">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v9m-3-3h6m-9-9h.008v.008H13V4.5zM3 10.5h.008v.008H3V10.5z"/></svg>
                        <span>添加朋友</span>
                    </button>
                    <button onclick="triggerEditNickname()" class="w-full px-4 py-3 text-left hover:bg-gray-700 flex items-center space-x-3">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
                        <span>修改我的昵称</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主屏幕页面卡片 -->
        <div class="flex-grow overflow-hidden relative">
            <div id="tab-chat" class="absolute inset-0 no-scrollbar overflow-y-auto divide-y divide-[#e5e5e5] bg-[#f7f7f7]">
                <div id="empty-chat" class="text-center text-gray-400 mt-24 text-sm px-6 leading-relaxed">
                    暂无会话。<br>点右上角加号添加对方，对方“同意”后立即开启聊天与音视频直连。
                </div>
                <div id="chat-list" class="divide-y divide-[#e5e5e5]"></div>
            </div>

            <div id="tab-contacts" class="absolute inset-0 hidden no-scrollbar overflow-y-auto bg-white divide-y divide-gray-100">
                <div onclick="openNewFriendsList()" class="flex items-center justify-between p-4 hover:bg-gray-50 cursor-pointer bg-white transition-colors">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-[6px] bg-orange-500 text-white flex items-center justify-center font-bold text-xl">👥</div>
                        <span class="text-sm font-semibold">新的朋友</span>
                    </div>
                    <div id="new-friends-badge" class="hidden px-2 py-0.5 bg-red-500 text-white text-[10px] rounded-full font-bold">0</div>
                </div>
                
                <div class="bg-[#f7f7f7] py-2 px-4 text-xs text-gray-500 font-medium">我的朋友</div>
                <div id="contacts-list" class="divide-y divide-gray-500/10"></div>
            </div>

            <!-- 发现栏目 -->
            <div id="tab-find" class="absolute inset-0 hidden no-scrollbar overflow-y-auto bg-[#ededed]">
                <div onclick="openMoments()" class="bg-white px-4 py-4 mt-3 flex justify-between items-center active:bg-gray-100 cursor-pointer border-t border-b border-gray-200">
                    <div class="flex items-center space-x-3">
                        <div class="p-1.5 bg-gradient-to-tr from-yellow-500 to-orange-500 text-white rounded-[6px]">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
                        </div>
                        <span class="text-sm font-medium text-gray-900">朋友圈</span>
                    </div>
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
                </div>
            </div>

            <!-- 个人中心 -->
            <div id="tab-me" class="absolute inset-0 hidden no-scrollbar overflow-y-auto bg-[#ededed]">
                <div class="bg-white px-6 py-8 flex items-center space-x-4 mt-3 border-b border-gray-200">
                    <div id="my-avatar" class="w-16 h-16 rounded-[6px] bg-[#07c160] text-white font-bold flex items-center justify-center text-2xl uppercase shadow-sm">U</div>
                    <div>
                        <h3 id="my-name" class="text-lg font-bold text-gray-900">用户昵称</h3>
                        <p id="my-phone" class="text-sm text-gray-500 mt-1">手机号: -</p>
                    </div>
                </div>

                <div class="bg-white px-4 py-4 mt-3 flex justify-between items-center border-t border-b border-gray-200">
                    <span class="text-sm text-gray-800">微信零钱</span>
                    <span id="my-balance" class="text-sm font-bold text-gray-500">¥100.00</span>
                </div>

                <button onclick="handleLogout()" class="w-full mt-6 py-3.5 bg-white text-red-500 font-semibold text-center border-t border-b border-gray-200 active:bg-gray-100 transition-colors">
                    安全退出当前登录
                </button>
            </div>
        </div>

        <nav class="border-t border-[#d2d2d2] bg-[#f7f7f7] flex justify-around items-center safe-padding-bottom min-h-[58px] z-40 relative">
            <button onclick="switchTab('chat')" id="nav-chat" class="flex-1 flex flex-col items-center justify-center text-[#07c160] py-1 relative">
                <div class="relative">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm11.378-3.917c-.89-.777-2.366-.777-3.255 0a.75.75 0 01-.988-1.13c1.434-1.25 3.8-1.25 5.23 0a.75.75 0 01-.987 1.13z"/></svg>
                    <div id="unread-chats-badge" class="hidden absolute -top-1.5 -right-2 px-1.5 py-0.5 bg-red-500 text-white text-[9px] rounded-full font-bold leading-none min-w-[14px] text-center">0</div>
                </div>
                <span class="text-[10px] mt-0.5 font-medium">微信</span>
            </button>
            
            <button onclick="switchTab('contacts')" id="nav-contacts" class="flex-grow flex flex-col items-center justify-center text-gray-400 py-1 relative">
                <div class="relative">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>
                    <div id="contacts-tab-dot" class="hidden absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full"></div>
                </div>
                <span class="text-[10px] mt-0.5 font-medium">通讯录</span>
            </button>
            
            <button onclick="switchTab('find')" id="nav-find" class="flex-grow flex flex-col items-center justify-center text-gray-400 py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12.75 3.03v.568c0 .334.148.65.405.864l4.038 3.348a.75.75 0 01.187.1l-4.038 3.348a1.125 1.125 0 01-.405.244v-.568a1.125 1.125 0 00-1.125-1.125h-2.25a1.125 1.125 0 00-1.125 1.125v.568a1.125 1.125 0 01-.405-.244L4.038 9.89a.75.75 0 01.187-.1l4.038-3.348a1.125 1.125 0 01.405-.1v-.568A1.125 1.125 0 0110.125 4.5h2.25A1.125 1.125 0 0112.75 3.03z"/></svg>
                <span class="text-[10px] mt-0.5 font-medium">发现</span>
            </button>
            <button onclick="switchTab('me')" id="nav-me" class="flex-grow flex flex-col items-center justify-center text-gray-400 py-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                <span class="text-[10px] mt-0.5 font-medium">我</span>
            </button>
        </nav>
    </div>

    <!-- 3. “新的朋友”好友验证请求中心 -->
    <div id="view-new-friends" class="hidden fixed inset-0 bg-[#ededed] flex flex-col z-[90] safe-padding-bottom">
        <header class="bg-[#ededed] px-4 pb-3 border-b border-[#e0e0e0] flex items-end justify-between ios-top-safe-padding min-h-[96px]">
            <div class="flex items-center space-x-1 pb-1">
                <button onclick="closeNewFriendsList()" class="text-gray-700 p-2 -ml-2 hover:bg-gray-200/50 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                </button>
                <span class="font-bold text-base">新的朋友</span>
            </div>
            <span class="text-xs text-gray-400 pb-2">验证列表</span>
        </header>
        <div id="new-friends-container" class="flex-grow overflow-y-auto p-4 space-y-3 no-scrollbar"></div>
    </div>

    <div id="view-chat-detail" class="hidden fixed inset-0 bg-[#f3f3f3] flex flex-col z-[80] safe-padding-bottom">
        <header class="bg-[#ededed] px-4 pb-3 border-b border-[#e0e0e0] flex items-end justify-between ios-top-safe-padding min-h-[96px]">
            <div class="flex items-center space-x-1 pb-1">
                <button onclick="closeChatDetail()" class="text-gray-700 p-2 -ml-2 focus:outline-none hover:bg-200/50 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                </button>
                <span id="chat-title" class="font-bold text-[#191919] text-base">加载中</span>
            </div>
            <span class="text-xs text-gray-400 pb-2">加密安全直连</span>
        </header>

        <div id="msg-container" class="flex-grow p-4 overflow-y-auto no-scrollbar space-y-4"></div>

        <div class="bg-[#ededed] border-t border-[#d2d2d2] px-3 py-2 flex flex-col space-y-2">
            <div class="flex items-center space-x-2">
                <input type="text" id="msg-input" placeholder="输入新消息..." class="flex-grow px-3 py-2 bg-white rounded-[6px] border-none focus:outline-none text-sm">
                <button onclick="sendChatMessage()" class="px-4 py-2 bg-[#07c160] hover:bg-[#06ad56] text-white font-bold text-xs rounded-[6px]">
                    发送
                </button>
            </div>
            <div class="flex justify-around py-1 text-gray-600 border-t border-gray-200/70 mt-1 pt-2">
                <button onclick="sendRedPacketPrompt()" class="flex flex-col items-center space-y-1">
                    <div class="p-2.5 bg-white rounded-xl border border-gray-300">
                        <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/><path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 11a1 1 0 100 2h1a1 1 0 100-2H4zm5 0a1 1 0 100 2h3a1 1 0 100-2H9z" clip-rule="evenodd"/></svg>
                    </div>
                    <span class="text-[10px] font-medium text-gray-500">红包</span>
                </button>
                <button onclick="initiateVideoCall()" class="flex flex-col items-center space-y-1">
                    <div class="p-2.5 bg-white rounded-xl border border-gray-300">
                        <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
                    </div>
                    <span class="text-[10px] font-medium text-gray-500">视频通话</span>
                </button>
            </div>
        </div>
    </div>

    <div id="view-call" class="hidden fixed inset-0 bg-black z-[200] flex flex-col justify-between p-6 text-white safe-padding-bottom ios-top-safe-padding">
        <video id="remote-video" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline></video>
        <video id="local-video" class="absolute right-4 top-24 w-28 h-40 rounded-lg border border-white/20 z-50 shadow-2xl" autoplay playsinline muted></video>

        <div class="relative z-40 text-center space-y-2 mt-12">
            <h2 id="call-user-name" class="text-2xl font-bold">呼叫中...</h2>
            <p id="call-status" class="text-sm text-gray-400">正在等待对方接听</p>
        </div>

        <div class="relative z-40 flex justify-center space-x-12 mb-10">
            <button onclick="terminateVideoCall()" class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center shadow-lg">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>

            </button>

    <!-- 微信朋友圈面板 -->
    <div id="view-moments" class="hidden fixed inset-0 bg-[#f7f7f7] flex flex-col z-[90] safe-padding-bottom">
        <header class="bg-[#ededed] px-4 pb-3 border-b border-[#e0e0e0] flex items-end justify-between ios-top-safe-padding min-h-[84px]">
            <button onclick="closeMoments()" class="text-gray-700 p-1 pb-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
            </button>
            <span class="font-bold pb-1">朋友圈</span>

    <!-- 红包领取窗口 -->
    <div id="modal-redpacket" class="hidden fixed inset-0 bg-black/60 z-[300] flex items-center justify-center p-6">
        <div class="relative w-full max-w-xs bg-red-600 rounded-2xl p-6 flex flex-col items-center justify-between space-y-8 shadow-2xl overflow-hidden fade-in">
            <div class="absolute -top-12 left-0 right-0 h-40 bg-red-700 rounded-b-full"></div>
            <div class="relative z-10 text-center space-y-2 text-yellow-300">
                <p id="rp-sender-name" class="font-bold text-lg text-white">来自好友的红包</p>
                <p class="text-xs opacity-90">给你发了一个大红包</p>
                <p class="text-xl font-bold mt-2">恭喜发财，大吉大利</p>
            </div>
            <button id="rp-open-btn" onclick="openRedPacketPhysics()" class="relative z-10 w-24 h-24 bg-yellow-400 border-4 border-yellow-200 text-yellow-950 font-black text-3xl rounded-full shadow-2xl flex items-center justify-center">
                開
            </button>
        </div>
    </div>

    <script type="module">
        // 1. iOS 安全自愈本地存储（防止 sandbox 抛 DOM Security 异常）
        const SafeStorage = {
            getItem: (key) => {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    return window.__local_storage_fallback?.[key] || null;
                }
            },
            setItem: (key, value) => {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    if (!window.__local_storage_fallback) {
                        window.__local_storage_fallback = {};
                    }
                    window.__local_storage_fallback[key] = value;
                }
            },
            removeItem: (key) => {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    if (window.__local_storage_fallback) {
                        delete window.__local_storage_fallback[key];
                    }
                }
            }
        };

        // 数据高阶本地缓存层
        const DB = {
            getUsers: () => JSON.parse(SafeStorage.getItem('andrew_users_cache') || '{}'),
            saveUsers: (users) => SafeStorage.setItem('andrew_users_cache', JSON.stringify(users)),
            getChats: () => JSON.parse(SafeStorage.getItem('andrew_chats') || '[]'),
            saveChats: (chats) => SafeStorage.setItem('andrew_chats', JSON.stringify(chats)),
            getMoments: () => JSON.parse(SafeStorage.getItem('andrew_moments') || '[]'),
            saveMoments: (moments) => SafeStorage.setItem('andrew_moments', JSON.stringify(moments)),
            getRequests: () => JSON.parse(SafeStorage.getItem('andrew_friend_requests') || '[]'),
            saveRequests: (requests) => SafeStorage.setItem('andrew_friend_requests', JSON.stringify(requests)),
            getUnreadCounts: () => JSON.parse(SafeStorage.getItem('andrew_unread_counts') || '{}'),
            saveUnreadCounts: (counts) => SafeStorage.setItem('andrew_unread_counts', JSON.stringify(counts))
        };

        // 引入 Firebase 官方同步套件
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 全球公网多端同步 Mesh Network（BroadcastChannel 备用中继）
        const syncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('andrewchat_mesh_sync') : null;

        // 全局共享绑定
        window.switchAuthMode = switchAuthMode;
        window.handleAuthSubmit = handleAuthSubmit;
        window.toggleAddMenu = toggleAddMenu;
        window.triggerAddFriend = triggerAddFriend;
        window.triggerEditNickname = triggerEditNickname;
        window.switchTab = switchTab;
        window.openNewFriendsList = openNewFriendsList;
        window.closeNewFriendsList = closeNewFriendsList;
        window.acceptFriendRequest = acceptFriendRequest;
        window.openChatDetailWindow = openChatDetailWindow;
        window.closeChatDetail = closeChatDetail;
        window.sendChatMessage = sendChatMessage;
        window.sendRedPacketPrompt = sendRedPacketPrompt;
        window.clickRedPacketBubble = clickRedPacketBubble;
        window.openRedPacketPhysics = openRedPacketPhysics;
        window.initiateVideoCall = initiateVideoCall;
        window.acceptVideoCallIncoming = acceptVideoCallIncoming;
        window.terminateVideoCall = terminateVideoCall;
        window.openMoments = openMoments;
        window.closeMoments = closeMoments;
        window.postMomentPrompt = postMomentPrompt;
        window.handleLogout = handleLogout;
        window.forceActivateMockMode = forceActivateMockMode;

        // 运行状态变量
        let db = null;
        let auth = null;
        let currentUser = null;
        let activeChatPhone = null;
        let localStream = null;
        let authMode = 'login';
        let currentOpeningRedPacketId = null;

        // 安全地获取环境注入变量，避免致命的未定义 ReferenceError
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'andrewchat-pwa';
        const rawFirebaseConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        const rawInitialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let globalAudioCtx = null;
        function getAudioContext() {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }
            return globalAudioCtx;
        }

        window.addEventListener('click', () => {
            try {
                const ctx = getAudioContext();
                if (ctx && ctx.state === 'suspended') ctx.resume();
            } catch (e) {
                console.warn("Audio Context unlock failed:", e);
            }
        }, { once: true });

        function playAudio(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                
                if (type === 'message') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(580, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(now + 0.18);
                } else if (type === 'coin') {
                    [1024, 1360].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                        gain.gain.setValueAtTime(0.15, now + idx * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.22);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.07);
                        osc.stop(now + idx * 0.07 + 0.25);
                    });
                } else if (type === 'ring') {
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc1.frequency.value = 450;
                    osc2.frequency.value = 480;
                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.setValueAtTime(0, now + 1.2);
                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 1.3);
                    osc2.stop(now + 1.3);
                }
            } catch (e) {
                console.warn("Audio Synthesizer exception:", e);
            }
        }

        // 微信高自愈解析好友信息
        function getUserDetails(phone) {
            const users = DB.getUsers();
            if (users[phone]) return users[phone];
            
            // 后台异步云端同步好友档案
            fetchAndCacheUserProfile(phone);
            return {
                phone: phone,
                name: `微信用户_${phone.slice(-4)}`,
                balance: 100.00,
                friends: []
            };
        }

        async function fetchAndCacheUserProfile(phone) {
            if (!db) return;
            try {
                const userDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', phone));
                if (userDoc.exists()) {
                    let users = DB.getUsers();
                    users[phone] = userDoc.data();
                    DB.saveUsers(users);
                    renderChats();
                }
            } catch (e) {
                console.warn("Background profiles sync ignored");
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        const startApp = async () => {
            if (!rawFirebaseConfig) {
                console.warn("无云端配置，自动启动本地多设备高速 Mesh 同步。");
                setupMockDatabase();
                document.getElementById('loading-layer').classList.add('hidden');
                return;
            }

            try {
                const firebaseConfig = JSON.parse(rawFirebaseConfig);
                const firebaseApp = initializeApp(firebaseConfig);
                auth = getAuth(firebaseApp);
                db = getFirestore(firebaseApp);

                let userCredential;
                if (rawInitialToken) {
                    userCredential = await signInWithCustomToken(auth, rawInitialToken);
                } else {
                    userCredential = await signInAnonymously(auth);
                }

                if (userCredential && userCredential.user) {
                    const savedUserPhone = SafeStorage.getItem('andrew_logged_in_user_phone');
                    if (savedUserPhone) {
                        onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'users', savedUserPhone), (snapshot) => {
                            if (snapshot.exists()) {
                                currentUser = snapshot.data();
                                loadMainDashboard();
                            }
                            document.getElementById('loading-layer').classList.add('hidden');
                        }, () => {
                            document.getElementById('loading-layer').classList.add('hidden');
                        });
                    } else {
                        document.getElementById('loading-layer').classList.add('hidden');
                    }
                }
            } catch (err) {
                console.error("Firebase Auth initialized exception, falling back:", err);
                setupMockDatabase();
                document.getElementById('loading-layer').classList.add('hidden');
            }
        };

        function forceActivateMockMode() {
            if (!currentUser) {
                setupMockDatabase();
            }
        }

        function setupMockDatabase() {
            db = null;
            auth = null;
            document.getElementById('network-status').innerText = "多端本地同步网";
            document.getElementById('network-status').className = "text-[9px] bg-sky-500/10 text-sky-600 font-bold px-1.5 py-0.5 rounded-full mt-0.5";
            
            const savedUserPhone = SafeStorage.getItem('andrew_logged_in_user_phone');
            if (savedUserPhone) {
                const users = DB.getUsers();
                if (users[savedUserPhone]) {
                    currentUser = users[savedUserPhone];
                    loadMainDashboard();
                }
            }
        }

        window.onload = () => {
            startApp();
        };

        if (syncChannel) {
            syncChannel.onmessage = (event) => {
                const { type, payload } = event.data;
                // 如果运行在本地 Mock 环境下，则通过 BroadcastChannel 进行不同 tab 间的 A/B 账户实时通讯模拟
                if (!db) {
                    handleLocalSyncMessage(type, payload);
                }
            };
        }

        function handleLocalSyncMessage(type, payload) {
            let users = DB.getUsers();
            let chats = DB.getChats();
            let requests = DB.getRequests();

            if (type === 'USER_REGISTERED') {
                users[payload.phone] = payload;
                DB.saveUsers(users);
                renderChats();
            } else if (type === 'FRIEND_REQUEST') {
                if (payload.toPhone === currentUser?.phone) {
                    requests.push(payload);
                    DB.saveRequests(requests);
                    playAudio('message');
                    showToast(`收到来自 ${payload.fromName} 的好友验证！`);
                    updateBadges();
                    if (!document.getElementById('view-new-friends').classList.contains('hidden')) {
                        renderNewFriendsList();
                    }
                }
            } else if (type === 'FRIEND_ACCEPTED') {
                if (payload.fromPhone === currentUser?.phone) {
                    // A 同意了 B 的好友请求
                    if (!currentUser.friends) currentUser.friends = [];
                    if (!currentUser.friends.includes(payload.toPhone)) {
                        currentUser.friends.push(payload.toPhone);
                    }
                    users[currentUser.phone] = currentUser;
                    DB.saveUsers(users);
                    
                    const reqIdx = requests.findIndex(r => r.fromPhone === payload.fromPhone && r.toPhone === payload.toPhone);
                    if (reqIdx !== -1) {
                        requests[reqIdx].status = 'accepted';
                        DB.saveRequests(requests);
                    }

                    playAudio('message');
                    showToast(`${payload.toName} 已通过您的好友验证！`);
                    renderChats();
                    updateBadges();
                }
            } else if (type === 'CHAT_MESSAGE') {
                if (payload.to === currentUser?.phone) {
                    chats.push(payload);
                    DB.saveChats(chats);
                    playAudio('message');
                    if (activeChatPhone !== payload.from) {
                        let unreadCounts = DB.getUnreadCounts();
                        unreadCounts[payload.from] = (unreadCounts[payload.from] || 0) + 1;
                        DB.saveUnreadCounts(unreadCounts);
                        
                        const sender = getUserDetails(payload.from);
                        showToast(`${sender.name}: ${payload.content}`);
                    }
                    renderChats();
                    updateBadges();
                    if (activeChatPhone === payload.from) {
                        refreshChatDetailOnly(payload.from);
                    }
                }
            } else if (type === 'VIDEO_CALL') {
                if (payload.to === currentUser?.phone && payload.status === 'offered') {
                    playAudio('ring');
                    document.getElementById('view-call').classList.remove('hidden');
                    document.getElementById('call-user-name').innerText = payload.fromName;
                    document.getElementById('call-status').innerText = '邀请您进行视频通话...';
                    document.getElementById('btn-accept-call').classList.remove('hidden');
                    activeChatPhone = payload.from;
                } else if (payload.from === currentUser?.phone && payload.status === 'accepted') {
                    document.getElementById('call-status').innerText = '通话已接通';
                    startLocalStream();
                } else if ((payload.from === currentUser?.phone || payload.to === currentUser?.phone) && payload.status === 'rejected') {
                    document.getElementById('view-call').classList.add('hidden');
                    stopCameraStream();
                }
            }
        }

        function switchAuthMode(mode) {
            authMode = mode;
            const loginBtn = document.getElementById('toggle-login-btn');
            const registerBtn = document.getElementById('toggle-register-btn');
            const mainSubmitBtn = document.getElementById('auth-main-btn');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-sm transition-all";
                registerBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all";
                mainSubmitBtn.innerText = "登录账号";
            } else {
                registerBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-gray-900 shadow-sm transition-all";
                loginBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all";
                mainSubmitBtn.innerText = "注册并登录";
            }
        }

        async function handleAuthSubmit() {
            const phone = document.getElementById('login-phone').value.trim();
            const pwd = document.getElementById('login-pwd').value;

            if (!phone || !pwd) {
                showToast('请完整输入手机号和密码！');
                return;
            }

            document.getElementById('loading-layer').classList.remove('hidden');

            if (!db) {
                // 本地同步 Mesh 模式下的注册/登录
                let users = DB.getUsers();
                if (authMode === 'login') {
                    const user = users[phone];
                    if (!user || user.pwd !== pwd) {
                        showToast('用户名或密码错误');
                        document.getElementById('loading-layer').classList.add('hidden');
                        return;
                    }
                    currentUser = user;
                } else {
                    if (users[phone]) {
                        showToast('该账号已被注册');
                        document.getElementById('loading-layer').classList.add('hidden');
                        return;
                    }
                    const randomId = Math.floor(Math.random() * 9000) + 1000;
                    currentUser = {
                        phone: phone,
                        pwd: pwd,
                        name: `微信用户_${randomId}`,
                        balance: 100.00,
                        friends: []
                    };
                    users[phone] = currentUser;
                    DB.saveUsers(users);

                    // 广播注册信息，便于对端能够秒级同步
                    if (syncChannel) {
                        syncChannel.postMessage({ type: 'USER_REGISTERED', payload: currentUser });
                    }
                }
                SafeStorage.setItem('andrew_logged_in_user_phone', phone);
                document.getElementById('loading-layer').classList.add('hidden');
                loadMainDashboard();
                return;
            }

            // 云端 Firebase 处理逻辑
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', phone);
                const userSnap = await getDoc(userDocRef);

                if (authMode === 'login') {
                    if (!userSnap.exists()) {
                        document.getElementById('loading-layer').classList.add('hidden');
                        showToast('账号尚未注册，请点击右侧注册！');
                        return;
                    }
                    if (userSnap.data().pwd !== pwd) {
                        document.getElementById('loading-layer').classList.add('hidden');
                        showToast('密码输入有误！');
                        return;
                    }
                    currentUser = userSnap.data();
                } else {
                    if (userSnap.exists()) {
                        document.getElementById('loading-layer').classList.add('hidden');
                        showToast('该手机号已被注册！');
                        return;
                    }
                    const randomId = Math.floor(Math.random() * 9000) + 1000;
                    currentUser = {
                        phone: phone,
                        pwd: pwd,
                        name: `微信用户_${randomId}`,
                        balance: 100.00,
                        friends: []
                    };
                    await setDoc(userDocRef, currentUser);
                }

                SafeStorage.setItem('andrew_logged_in_user_phone', phone);
                onSnapshot(userDocRef, (snap) => {
                    if (snap.exists()) {
                        currentUser = snap.data();
                        renderChats();
                        updateBadges();
                    }
                });

                document.getElementById('loading-layer').classList.add('hidden');
                loadMainDashboard();
            } catch (err) {
                document.getElementById('loading-layer').classList.add('hidden');
                showToast('云同步异常，自动挂载本地多端直连网格');
                setupMockDatabase();
            }
        }

        function loadMainDashboard() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-main').classList.remove('hidden');
            document.getElementById('view-main').classList.add('flex');

            document.getElementById('my-name').innerText = currentUser.name;
            document.getElementById('my-phone').innerText = `微信号: ${currentUser.phone}`;
            document.getElementById('my-avatar').innerText = currentUser.name.charAt(0);
            document.getElementById('my-balance').innerText = `¥${currentUser.balance.toFixed(2)}`;

            if (!db) {
                document.getElementById('network-status').innerText = "多端本地同步网";
                document.getElementById('network-status').className = "text-[9px] bg-sky-500/10 text-sky-600 font-bold px-1.5 py-0.5 rounded-full mt-0.5";
                renderChats();
                updateBadges();
                return;
            }

            document.getElementById('network-status').innerText = "云端同步模式";
            document.getElementById('network-status').className = "text-[9px] bg-emerald-500/10 text-emerald-600 font-bold px-1.5 py-0.5 rounded-full mt-0.5";

            // 长效监听申请列表增量，实现秒亮红标和音效通知
            let isRequestsFirstLoad = true;
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), (snapshot) => {
                const requests = [];
                snapshot.forEach(d => requests.push(d.data()));
                DB.saveRequests(requests);

                snapshot.docChanges().forEach(change => {
                    if (!isRequestsFirstLoad) {
                        const req = change.doc.data();
                        if (change.type === 'added' && req.toPhone === currentUser.phone && req.status === 'pending') {
                            playAudio('message');
                            showToast(`收到来自 ${req.fromName} 的好友申请！`);
                        }
                        if (change.type === 'modified' && req.fromPhone === currentUser.phone && req.status === 'accepted') {
                            playAudio('message');
                            showToast(`${req.toPhone} 已同意并通过了您的好友验证！`);
                            syncCurrentUserProfile();
                        }
                    }
                });

                isRequestsFirstLoad = false;
                updateBadges();
                if (!document.getElementById('view-new-friends').classList.contains('hidden')) {
                    renderNewFriendsList();
                }
            });

            // 监听全局消息气泡同步
            let isMessagesFirstLoad = true;
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), (snapshot) => {
                const chats = [];
                snapshot.forEach(d => chats.push(d.data()));
                
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added' && !isMessagesFirstLoad) {
                        const msg = change.doc.data();
                        if (msg.to === currentUser.phone) {
                            playAudio('message');
                            if (activeChatPhone !== msg.from) {
                                let unreadCounts = DB.getUnreadCounts();
                                unreadCounts[msg.from] = (unreadCounts[msg.from] || 0) + 1;
                                DB.saveUnreadCounts(unreadCounts);
                                
                                const sender = getUserDetails(msg.from);
                                showToast(`${sender.name}: ${msg.content}`);
                            }
                        }
                    }
                });

                isMessagesFirstLoad = false;
                DB.saveChats(chats);
                renderChats();
                updateBadges();

                if (activeChatPhone) {
                    refreshChatDetailOnly(activeChatPhone);
                }
            });

            // 监听 WebRTC 音视频视频频道状态
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'calls'), (snapshot) => {
                snapshot.forEach(d => {
                    const call = d.data();
                    if (call.to === currentUser.phone && call.status === 'offered') {
                        playAudio('ring');
                        document.getElementById('view-call').classList.remove('hidden');
                        document.getElementById('call-user-name').innerText = call.fromName;

        async function acceptFriendRequest(senderPhone) {
            document.getElementById('loading-layer').classList.remove('hidden');

            if (!db) {
                // Mock 模式下的好友打通与多端 BroadcastChannel 握手
                let users = DB.getUsers();
                if (!currentUser.friends) currentUser.friends = [];
                if (!currentUser.friends.includes(senderPhone)) {
                    currentUser.friends.push(senderPhone);
                }
                users[currentUser.phone] = currentUser;

                if (!users[senderPhone]) {
                    users[senderPhone] = { phone: senderPhone, pwd: '123', name: `微信用户_${senderPhone.slice(-4)}`, balance: 100.00, friends: [] };
                }
                if (!users[senderPhone].friends) users[senderPhone].friends = [];
                if (!users[senderPhone].friends.includes(currentUser.phone)) {
                    users[senderPhone].friends.push(currentUser.phone);
                }
                DB.saveUsers(users);

                let requests = DB.getRequests();
                const reqIdx = requests.findIndex(r => r.fromPhone === senderPhone && r.toPhone === currentUser.phone);
                if (reqIdx !== -1) {
                    requests[reqIdx].status = 'accepted';
                    DB.saveRequests(requests);
                }

                if (syncChannel) {
                    syncChannel.postMessage({
                        type: 'FRIEND_ACCEPTED',
                        payload: { fromPhone: senderPhone, toPhone: currentUser.phone, toName: currentUser.name }
                    });
                }

                document.getElementById('loading-layer').classList.add('hidden');
                showToast('已同意对方的验证申请！');
                setTimeout(() => {
                    closeNewFriendsList();
                    openChatDetailWindow(senderPhone);
                }, 800);
                return;
            }

            try {
                const myUserRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.phone);
                const senderUserRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', senderPhone);

                await updateDoc(myUserRef, { friends: arrayUnion(senderPhone) });
                await updateDoc(senderUserRef, { friends: arrayUnion(currentUser.phone) });

                const reqId = `${senderPhone}_to_${currentUser.phone}`;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'requests', reqId), { status: 'accepted' });

                document.getElementById('loading-layer').classList.add('hidden');
                showToast('已同意好友验证，现在可以聊天了！');

                setTimeout(() => {
                    closeNewFriendsList();
                    openChatDetailWindow(senderPhone);
                }, 800);
            } catch (err) {
                document.getElementById('loading-layer').classList.add('hidden');
                showToast('网络状态异常，同意申请未成功');
            }
        }

                showToast('无法添加您本人绑定的号码！');

            document.getElementById('loading-layer').classList.remove('hidden');

            const reqPayload = {
                id: `${currentUser.phone}_to_${targetPhone}`,
                fromPhone: currentUser.phone,
                fromName: currentUser.name,
                toPhone: targetPhone,
                status: 'pending',
                timestamp: Date.now()
            };

            if (!db) {
                let users = DB.getUsers();

                    users[targetPhone] = {
                        phone: targetPhone,
                        pwd: '123',
                        name: `微信用户_${targetPhone.slice(-4)}`,
                        balance: 100.00,
                        friends: []
                    };

                if (!requests.some(r => r.id === reqPayload.id)) {

                if (syncChannel) {

        function refreshChatDetailOnly(phone) {
            const container = document.getElementById('msg-container');
            const previousScroll = container.scrollHeight - container.scrollTop;
            container.innerHTML = '';

            const allChats = DB.getChats();
            const conversation = allChats.filter(c => 
                (c.from === currentUser.phone && c.to === phone) || 
                (c.from === phone && c.to === currentUser.phone)
            ).sort((a,b) => a.timestamp - b.timestamp);

            conversation.forEach(msg => {
                const isMe = msg.from === currentUser.phone;
                appendMessageBubble(msg.from, msg.content, isMe, msg.redPacket);
            });

            container.scrollTop = container.scrollHeight - previousScroll;
            if (previousScroll < 150) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function stopCameraStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
        }

        // 朋友圈动态
        function openMoments() {
            document.getElementById('view-moments').classList.remove('hidden');
            renderMoments();
        }
        function closeMoments() { document.getElementById('view-moments').classList.add('hidden'); }

        function renderMoments() {
            const container = document.getElementById('moments-container');
            container.innerHTML = '';
            const moments = DB.getMoments();

            if (moments.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 mt-20 text-sm">暂无朋友圈动态</p>`;
                return;
            }

            moments.forEach(m => {
                const sender = getUserDetails(m.author);
                const card = document.createElement('div');
                card.className = "bg-white rounded-[6px] p-4 shadow-sm border border-gray-100 flex space-x-3";
                card.innerHTML = `
                    <div class="w-10 h-10 rounded-[6px] bg-emerald-500 text-white font-black flex items-center justify-center text-lg uppercase">${sender.name.charAt(0)}</div>
                    <div class="flex-grow">
                        <h4 class="text-xs font-bold text-sky-600">${sender.name}</h4>
                        <p class="text-sm text-gray-800 mt-1.5 leading-relaxed">${m.content}</p>
                        <p class="text-[10px] text-gray-400 mt-3">刚刚 ｜ AndrewChat</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function postMomentPrompt() {
            const text = prompt('说点什么吧：');
            if (!text) return;
            
            document.getElementById('loading-layer').classList.remove('hidden');

            try {
                const moments = DB.getMoments();
                moments.unshift({ author: currentUser.phone, content: text, time: Date.now() });
                DB.saveMoments(moments);

                if (db) {
                    const momentRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'moments'));
                    await setDoc(momentRef, {
                        id: momentRef.id,
                        author: currentUser.phone,
                        content: text,
                        timestamp: Date.now()
                    });
                }

                document.getElementById('loading-layer').classList.add('hidden');
                renderMoments();
                showToast('朋友圈动态发布成功！');
            } catch(e) {
                document.getElementById('loading-layer').classList.add('hidden');
            }
        }

        // 主路由切换
        function switchTab(tabId) {
            const tabs = ['chat', 'contacts', 'find', 'me'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex-grow flex flex-col items-center justify-center text-gray-400 py-1";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "flex-grow flex flex-col items-center justify-center text-[#07c160] py-1";

            const titles = { chat: '微信', contacts: '通讯录', find: '发现', me: '我的' };
            document.getElementById('main-title').innerText = titles[tabId];
            
            updateBadges();
        }

        function toggleAddMenu() {
            document.getElementById('add-menu').classList.toggle('hidden');
        }

        function handleLogout() {
            SafeStorage.removeItem('andrew_logged_in_user_phone');
            currentUser = null;
            document.getElementById('view-main').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
            showToast('已安全退出当前登录');
        }
    </script>
</body>
</html>
