<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AndrewChat</title>
    <!-- PWA Manifest (使用相对路径，彻底规避 iOS 404 缓存路径 Bug) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ededed">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PeerJS WebRTC P2P 端到端通信库 -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f7f7f7;
            color: #191919;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 经典微信尖角气泡 */
        .bubble-me::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 14px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 6px solid #95ec69;
        }
        .bubble-other::after {
            content: '';
            position: absolute;
            left: -6px;
            top: 14px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 6px solid #ffffff;
        }
        /* 微信绿 */
        .wx-green-bg {
            background-color: #07c160;
        }
        .wx-green-text {
            color: #07c160;
        }
        /* 旋转金币动画 */
        @keyframes rotate-coin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        .animate-spin-coin {
            animation: rotate-coin 1.2s linear infinite;
        }
    </style>
</head>
<body class="bg-[#f7f7f7] min-h-screen flex flex-col justify-between overflow-hidden">

    <!-- ================= 1. 登录注册页面 (Auth View) ================= -->
    <div id="auth-view" class="fixed inset-0 bg-[#f7f7f7] z-[100] flex flex-col justify-between p-6 transition-transform duration-300">
        <div class="mt-24 text-center">
            <div class="w-20 h-20 mx-auto flex items-center justify-center">
                <!-- 官方微信高保真图标 -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/WeChat_logo_2018.svg" class="w-20 h-20 drop-shadow" alt="AndrewChat">
            </div>
            <h1 class="text-2xl font-bold mt-4 tracking-tight text-gray-900">AndrewChat</h1>
            <p class="text-xs text-gray-500 mt-1">云端数据实时互通多端版</p>
        </div>

        <div class="space-y-4 max-w-sm mx-auto w-full mb-24">
            <div class="bg-white rounded-xl p-1.5 flex items-center border border-gray-200/80 shadow-sm">
                <span class="px-3 text-gray-400 text-sm border-r border-gray-100">+86</span>
                <input type="tel" id="auth-phone" placeholder="请输入手机号" class="flex-grow p-2 text-sm focus:outline-none" value="">
            </div>
            <div class="bg-white rounded-xl p-1.5 flex items-center border border-gray-200/80 shadow-sm">
                <input type="password" id="auth-pwd" placeholder="请输入密码" class="flex-grow p-2 text-sm focus:outline-none">
            </div>
            
            <div class="flex gap-4 pt-2">
                <button onclick="handleRegister()" class="flex-1 py-3 bg-gray-200 hover:bg-gray-200/80 text-gray-800 text-sm font-semibold rounded-xl transition active:scale-95">注册</button>
                <button onclick="handleLogin()" class="flex-1 py-3 wx-green-bg hover:bg-[#06ae56] text-white text-sm font-semibold rounded-xl transition active:scale-95 shadow-md shadow-emerald-600/10">登录</button>
            </div>
            <p class="text-[10px] text-center text-gray-400">支持不同设备和浏览器实时登录，数据全球云端漫游</p>
        </div>
    </div>

    <!-- ================= 2. 主体框架 (App Main Container) ================= -->
    <div id="app-view" class="hidden flex-grow flex flex-col h-screen overflow-hidden">
        
        <!-- 头部顶栏 -->
        <header class="bg-[#ededed] px-4 py-3 flex justify-between items-center border-b border-gray-200 shrink-0 sticky top-0 z-40">
            <h2 id="header-title" class="text-lg font-bold text-gray-800">AndrewChat</h2>
            <div class="flex items-center space-x-5 text-gray-800 relative">
                <!-- 高保真加号下拉菜单触发按钮 -->
                <button onclick="togglePlusMenu()" class="hover:opacity-70 active:scale-90 transition"><i data-lucide="plus-circle" class="w-5.5 h-5.5"></i></button>
                
                <!-- 微信官方版加号下拉菜单 -->
                <div id="plus-dropdown" class="hidden absolute right-0 top-8 bg-[#4c4c4c] text-white rounded-lg shadow-xl py-1 w-36 z-50 transition-all duration-150">
                    <button onclick="openCreateGroupModal(); togglePlusMenu()" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-white/10 flex items-center space-x-2 border-b border-white/5">
                        <i data-lucide="message-square-plus" class="w-4 h-4"></i>
                        <span>发起群聊</span>
                    </button>
                    <button onclick="openAddFriendModal(); togglePlusMenu()" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-white/10 flex items-center space-x-2 border-b border-white/5">
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        <span>添加朋友</span>
                    </button>
                    <button onclick="openEditNameModal(); togglePlusMenu()" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-white/10 flex items-center space-x-2">
                        <i data-lucide="user-cog" class="w-4 h-4"></i>
                        <span>修改昵称</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 内容滚动区 -->
        <main class="flex-grow overflow-y-auto no-scrollbar pb-20 bg-[#f7f7f7]">
            
            <!-- TAB 1: 消息列表 (Chats Tab) -->
            <section id="tab-chats" class="divide-y divide-gray-100">
                <!-- 动态聊天项将被插入此处 -->
            </section>

            <!-- TAB 2: 通讯录 (Contacts Tab) -->
            <section id="tab-contacts" class="hidden">
                <div class="p-3 bg-gray-100 text-[10px] text-gray-500 uppercase tracking-wider font-semibold">我的好友</div>
                <div id="contact-list" class="bg-white divide-y divide-gray-100">
                    <!-- 好友项将被插入 -->
                </div>
                <div class="p-3 bg-gray-100 text-[10px] text-gray-500 uppercase tracking-wider font-semibold">我的群聊</div>
                <div id="group-list" class="bg-white divide-y divide-gray-100">
                    <!-- 群组项将被插入 -->
                </div>
            </section>

            <!-- TAB 3: 发现 (Discover Tab) -->
            <section id="tab-discover" class="hidden divide-y divide-gray-200">
                <div onclick="openMoments()" class="p-4 bg-white flex justify-between items-center cursor-pointer hover:bg-gray-50 border-b border-gray-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-6 h-6 bg-blue-500 rounded flex items-center justify-center text-white">
                            <i data-lucide="aperture" class="w-4 h-4"></i>
                        </div>
                        <span class="text-gray-800 text-sm font-semibold">朋友圈</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div id="moments-badge" class="w-2 h-2 rounded-full bg-red-500 hidden"></div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                    </div>
                </div>
            </section>

            <!-- TAB 4: 我 (Profile Tab) -->
            <section id="tab-me" class="hidden space-y-4">
                <div onclick="openEditNameModal()" class="bg-white p-6 flex items-center justify-between border-b border-gray-100 cursor-pointer hover:bg-gray-50">
                    <div class="flex items-center space-x-4">
                        <div id="me-avatar" class="w-16 h-16 bg-emerald-500 rounded-lg flex items-center justify-center text-2xl font-bold text-white shadow-inner">
                            A
                        </div>
                        <div>
                            <h3 id="me-name" class="text-lg font-bold text-gray-800">未设置</h3>
                            <p id="me-phone" class="text-xs text-gray-400 mt-1">微信号: --</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 text-gray-400 text-xs">
                        <span>修改昵称</span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </div>
                </div>

                <!-- 钱包与模拟支付 -->
                <div class="bg-white p-4 flex justify-between items-center border-y border-gray-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-amber-500 rounded-lg flex items-center justify-center text-white">
                            <i data-lucide="wallet" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <span class="text-sm font-semibold text-gray-800">服务与钱包</span>
                            <p class="text-[10px] text-gray-400">模拟币收发余额</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span id="me-balance" class="text-sm font-bold text-gray-700">¥100.00</span>
                        <button onclick="topUpBalance()" class="block text-[10px] text-emerald-500 font-semibold hover:underline">充值模拟币</button>
                    </div>
                </div>

                <div class="px-4 pt-6">
                    <button onclick="handleLogout()" class="w-full py-3 bg-red-50 text-red-500 text-sm font-semibold rounded-xl hover:bg-red-100 transition active:scale-95">
                        退出登录
                    </button>
                </div>
            </section>

        </main>

        <!-- 底部高保真导航栏 -->
        <nav class="fixed bottom-0 left-0 right-0 bg-[#f7f7f7] border-t border-gray-200/80 py-2 pb-5 flex justify-around items-center shrink-0 z-30 shadow-sm">
            <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center text-emerald-500">
                <i data-lucide="message-square" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-semibold">微信</span>
            </button>
            <button onclick="switchTab('contacts')" id="nav-contacts" class="flex flex-col items-center text-gray-400">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-semibold">通讯录</span>
            </button>
            <button onclick="switchTab('discover')" id="nav-discover" class="flex flex-col items-center text-gray-400">
                <i data-lucide="compass" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-semibold">发现</span>
            </button>
            <button onclick="switchTab('me')" id="nav-me" class="flex flex-col items-center text-gray-400">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-semibold">我</span>
            </button>
        </nav>
    </div>

    <!-- ================= 3. 聊天窗系统 (Chat Window Overlay) ================= -->
    <div id="chat-window" class="fixed inset-0 bg-[#f7f7f7] z-50 flex flex-col hidden">
        <!-- 头部 -->
        <header class="bg-[#ededed] px-4 py-3 flex justify-between items-center border-b border-gray-200">
            <div class="flex items-center space-x-2">
                <button onclick="closeChatWindow()" class="hover:opacity-70 active:scale-90 transition"><i data-lucide="chevron-left" class="w-6 h-6 text-gray-700"></i></button>
                <h3 id="chat-title" class="text-sm font-bold text-gray-800">对话中</h3>
            </div>
            <button id="chat-info-btn" class="hover:opacity-70"><i data-lucide="more-horizontal" class="w-5 h-5 text-gray-700"></i></button>
        </header>
        <!-- 聊天气泡显示区 -->
        <div id="chat-messages" class="flex-grow p-4 overflow-y-auto no-scrollbar space-y-4 bg-[#f3f3f3]">
            <!-- 气泡 -->
        </div>
        <!-- 附加多功能面板 (红包、视频) -->
        <div id="chat-panel" class="bg-[#f7f7f7] border-t border-gray-200 p-4 grid grid-cols-4 gap-4 hidden">
            <button onclick="openSendRedPacketModal()" class="flex flex-col items-center space-y-1 hover:scale-95 transition">
                <div class="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center text-white shadow">
                    <i data-lucide="gift" class="w-6 h-6"></i>
                </div>
                <span class="text-[10px] text-gray-600">红包</span>
            </button>
            <button onclick="startVideoCall()" class="flex flex-col items-center space-y-1 hover:scale-95 transition">
                <div class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-white shadow">
                    <i data-lucide="video" class="w-6 h-6"></i>
                </div>
                <span class="text-[10px] text-gray-600">视频通话</span>
            </button>
        </div>
        <!-- 键盘输入底栏 -->
        <div class="bg-[#ededed] px-4 py-2 flex items-center space-x-2 border-t border-gray-200 pb-6 shrink-0">
            <button onclick="toggleChatPanel()" class="hover:opacity-70 active:scale-95 transition"><i data-lucide="plus-circle" class="w-6 h-6 text-gray-600"></i></button>
            <input type="text" id="chat-input" placeholder="发送新消息..." class="flex-grow p-2 rounded-lg text-sm bg-white focus:outline-none border border-gray-200 shadow-inner">
            <button onclick="sendTextMessage()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg shadow-sm">发送</button>
        </div>
    </div>

    <!-- ================= 4. 朋友圈 (Moments View Overlay) ================= -->
    <div id="moments-view" class="fixed inset-0 bg-[#f7f7f7] z-50 flex flex-col hidden">
        <header class="bg-black/95 text-white px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <button onclick="closeMoments()" class="hover:opacity-70"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                <h3 class="text-sm font-semibold">朋友圈</h3>
            </div>
            <button onclick="openPublishMomentModal()" class="hover:opacity-70"><i data-lucide="camera" class="w-5 h-5"></i></button>
        </header>
        <div class="flex-grow overflow-y-auto no-scrollbar space-y-6 pb-12">
            <!-- 头图大背景 -->
            <div class="relative h-48 bg-gradient-to-r from-teal-950 to-emerald-950 flex items-end justify-end p-4">
                <div class="flex items-center space-x-3 translate-y-6">
                    <span id="moments-cover-name" class="text-white font-bold text-sm drop-shadow">汉车主</span>
                    <div id="moments-cover-avatar" class="w-16 h-16 rounded-xl bg-emerald-500 border-2 border-white flex items-center justify-center font-bold text-white text-lg shadow-md">A</div>
                </div>
            </div>
            <div class="h-6"></div>
            <!-- 朋友圈列表 -->
            <div id="moments-list" class="px-4 space-y-6 divide-y divide-gray-100">
                <!-- 朋友圈卡片 -->
            </div>
        </div>
    </div>

    <!-- ================= 5. 发送红包弹窗 ================= -->
    <div id="send-redpacket-modal" class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-6 hidden">
        <div class="bg-[#f7f7f7] w-full max-w-xs rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <h3 class="text-sm font-bold text-red-600">发红包</h3>
                <button onclick="closeSendRedPacketModal()"><i data-lucide="x" class="w-4 h-4 text-gray-400"></i></button>
            </div>
            <div class="space-y-3">
                <div class="bg-white p-2.5 rounded-lg border border-gray-100 flex justify-between items-center">
                    <span class="text-xs text-gray-500">总金额</span>
                    <div class="flex items-center space-x-1">
                        <input type="number" id="rp-amount" placeholder="0.00" class="w-20 text-right text-sm font-semibold focus:outline-none">
                        <span class="text-xs text-gray-400">元</span>
                    </div>
                </div>
                <div class="bg-white p-2.5 rounded-lg border border-gray-100 flex justify-between items-center">
                    <span class="text-xs text-gray-500">红包个数</span>
                    <div class="flex items-center space-x-1">
                        <input type="number" id="rp-count" placeholder="1" class="w-20 text-right text-sm font-semibold focus:outline-none" value="1">
                        <span class="text-xs text-gray-400">个</span>
                    </div>
                </div>
                <input type="text" id="rp-desc" placeholder="恭喜发财，大吉大利" class="w-full bg-white p-2.5 rounded-lg border border-gray-100 text-xs focus:outline-none">
            </div>
            <div class="text-center pt-2">
                <span id="rp-total-display" class="text-xl font-bold text-gray-800">¥ 0.00</span>
                <button onclick="submitSendRedPacket()" class="w-full mt-3 py-3 bg-red-500 hover:bg-red-600 text-white text-xs font-bold rounded-xl shadow-md transition">塞钱进红包</button>
            </div>
        </div>
    </div>

    <!-- ================= 6. 拆红包动效面板 ================= -->
    <div id="open-redpacket-overlay" class="fixed inset-0 bg-black/80 z-[70] flex items-center justify-center p-6 hidden">
        <div class="bg-[#cf3e36] w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl relative flex flex-col items-center p-6 text-center space-y-6">
            <button onclick="closeOpenRedPacketOverlay()" class="absolute left-4 top-4 text-white/60 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            
            <div class="space-y-2 mt-4 text-amber-200">
                <div id="rp-sender-avatar" class="w-12 h-12 rounded-full bg-white/20 mx-auto border border-white/10 flex items-center justify-center text-lg font-bold text-white">发</div>
                <p id="rp-sender-name" class="text-xs">某人发出的红包</p>
                <h4 id="rp-sender-desc" class="text-base font-semibold text-white">恭喜发财，大吉大利</h4>
            </div>

            <!-- 金币“開”字按钮 -->
            <button id="rp-open-btn" class="w-20 h-20 bg-amber-400 hover:bg-amber-300 rounded-full border-4 border-amber-500 flex items-center justify-center text-2xl font-bold text-red-700 shadow-lg cursor-pointer transform hover:scale-105 transition-transform duration-200">
                開
            </button>

            <!-- 拆开后的明细 -->
            <div id="rp-detail-view" class="hidden text-white space-y-2">
                <span class="text-xs text-amber-100">已存入零钱钱包</span>
                <h3 id="rp-detail-amount" class="text-3xl font-extrabold text-amber-300">¥ 0.00</h3>
            </div>
        </div>
    </div>

    <!-- ================= 7. 跨设备真实 WebRTC 视频通话 ================= -->
    <div id="video-call-overlay" class="fixed inset-0 bg-gray-900 z-[80] flex flex-col justify-between p-6 text-center text-white hidden">
        <!-- 视频画面轨道 -->
        <div class="absolute inset-0 z-0 overflow-hidden bg-slate-950 flex items-center justify-center">
            <!-- 对方画面：如果有真实媒体流，绑定此 video，否则显示占位符 -->
            <div id="remote-video-placeholder" class="w-32 h-32 rounded-full bg-emerald-500/20 border-4 border-emerald-400 flex items-center justify-center text-4xl font-bold animate-pulse">
                呼
            </div>
            <video id="remote-video" class="w-full h-full object-cover hidden" autoplay playsinline></video>
        </div>

        <!-- 本地摄像头画面 PIP -->
        <div class="absolute top-6 right-6 w-24 h-36 bg-gray-800 rounded-xl overflow-hidden border border-white/20 z-10 shadow-lg">
            <video id="local-video" class="w-full h-full object-cover" autoplay playsinline muted></video>
        </div>

        <div class="z-10 mt-20 space-y-2">
            <h3 id="video-caller-name" class="text-xl font-bold">张伟</h3>
            <p id="video-call-status" class="text-xs text-emerald-400">正在等待对方接受邀请...</p>
        </div>

        <!-- 操控区 -->
        <div class="z-10 mb-10 flex justify-center space-x-12">
            <!-- 拒绝/挂断按钮 -->
            <button onclick="hangupVideoCall()" class="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center hover:scale-105 transition active:scale-95 shadow-lg">
                <i data-lucide="phone-off" class="w-6 h-6 text-white"></i>
            </button>
            <!-- 接受按钮 (来电时可见) -->
            <button id="video-accept-btn" onclick="acceptVideoCall()" class="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center hover:scale-105 transition active:scale-95 shadow-lg hidden">
                <i data-lucide="phone" class="w-6 h-6 text-white"></i>
            </button>
        </div>
    </div>

    <!-- ================= 8. 功能弹窗及对话框 ================= -->
    <!-- 添加朋友弹窗 -->
    <div id="add-friend-modal" class="fixed inset-0 bg-black/60 z-[90] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-xs rounded-2xl p-4 space-y-3 shadow-xl">
            <h4 class="text-sm font-bold text-gray-800">添加朋友</h4>
            <input type="tel" id="search-phone" placeholder="输入对方手机号..." class="w-full p-2 border border-gray-200 rounded-lg text-xs focus:outline-none">
            <div class="flex gap-2">
                <button onclick="closeAddFriendModal()" class="flex-1 py-2 bg-gray-100 text-gray-600 text-xs rounded-lg">取消</button>
                <button onclick="submitAddFriend()" class="flex-1 py-2 bg-emerald-500 text-white text-xs rounded-lg font-semibold">查找并添加</button>
            </div>
        </div>
    </div>

    <!-- 发起群聊弹窗 -->
    <div id="create-group-modal" class="fixed inset-0 bg-black/60 z-[90] flex items-center justify-center p-6 hidden">
        <div class="bg-white w-full max-w-xs rounded-2xl p-4 space-y-3 shadow-xl">
            <h4 class="text-sm font-bold text-gray-800">一键建群</h4>
            <input type="text" id="group-name-input" placeholder="输入群聊名称..." class="w-full p-2 border border-gray-200 rounded-lg text-xs focus:outline-none">
            <div class="space-y-2 max-h-32 overflow-y-auto" id="group-friends-checkbox">
                <!-- 好友多选 -->
            </div>
            <div class="flex gap-2">

    <!-- ================= 9. 数据、云同步、WebRTC 脚本系统 ================= -->
    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 纯代码合成音效
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let ringtoneInterval = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'message') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.setValueAtTime(1600, now + 0.08);
                osc.frequency.setValueAtTime(2000, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'ringtone-start') {
                if (ringtoneInterval) return;
                ringtoneInterval = setInterval(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }, 1000);
            } else if (type === 'ringtone-stop') {
                if (ringtoneInterval) {
                    clearInterval(ringtoneInterval);
                    ringtoneInterval = null;
                }
            }
        }

        // 全局 Toast 提示
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2000);
        }

        // ================= 跨设备全球云数据库引擎 =================
        // 我们利用无条件免费且高速的 kvdb.io 公共 Bucket 来实现无后端跨设备数据互通
        const DB_BUCKET = "and_chat_global_db_v2"; 
        const DB_BASE = `https://kvdb.io/${DB_BUCKET}/`;

        async function cloudGet(key) {
            try {
                const response = await fetch(DB_BASE + key);
                if (!response.ok) return null;
                return await response.json();
            } catch (e) {
                console.warn("Cloud Read Fail, Using Local Fallback:", e);
                return JSON.parse(localStorage.getItem(`local_${key}`));
            }
        }

        async function cloudSet(key, value) {
            try {
                localStorage.setItem(`local_${key}`, JSON.stringify(value));
                await fetch(DB_BASE + key, {
                    method: 'POST',
                    body: JSON.stringify(value),
                    headers: { 'Content-Type': 'application/json' }
                });
                return true;
            } catch (e) {
                console.error("Cloud Write Fail:", e);
                return false;
            }
        }

        // 简易安全散列算法（保障用户上传密码隐私，绝不存储明文密码）
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return hash.toString(16);
        }

        // ================= 核心状态管理 =================
        let currentUser = null; 
        let activeChatSession = null; 
        let isGroupChat = false;
        let peer = null; 
        let activeCall = null; 
        let localStream = null;

        // 开启 WebRTC 信号层及监听
        function initPeerJS() {
            if (peer) return;
            const peerId = `andrewchat_${currentUser.phone}`;
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                console.log('AndrewChat WebRTC 信道已挂载:', id);
            });

            // 监听端到端视频通话请求
            peer.on('call', async (incomingCall) => {
                activeCall = incomingCall;
                playSound('ringtone-start');
                
                const callerPhone = incomingCall.peer.replace('andrewchat_', '');
                let callerName = callerPhone;
                const cloudUser = await cloudGet(`user_${callerPhone}`);
                if (cloudUser) callerName = cloudUser.name;

                document.getElementById('video-caller-name').innerText = callerName;
                document.getElementById('video-call-status').innerText = '邀请你进行视频通话...';
                document.getElementById('video-accept-btn').classList.remove('hidden');
                document.getElementById('video-call-overlay').classList.remove('hidden');
            });

            peer.on('error', (err) => {
                console.warn('PeerJS Connection Info:', err);
            });
        }

        // ================= 注册、登录、登出 =================
        async function handleRegister() {
            const phone = document.getElementById('auth-phone').value.trim();
            const pwd = document.getElementById('auth-pwd').value.trim();
            if (!phone || !pwd) return showToast('请完整输入手机号和密码');
            if (phone.length < 5) return showToast('手机号码位数不正确');

            showToast('正在创建云端账户...');
            
            // 检查该用户在云数据库中是否已注册
            const existing = await cloudGet(`user_${phone}`);
            if (existing) return showToast('该手机号已被注册');

            const defaultName = `用户_${phone.slice(-4)}`;
            const newUser = {
                phone: phone,
                name: defaultName,
                pwdHash: simpleHash(pwd),
                balance: 100.0,
                friends: ['13800000001'] // 默认内置一个客服助手好友
            };

            const success = await cloudSet(`user_${phone}`, newUser);
            if (success) {
                showToast('注册成功！');
                handleLogin();
            } else {
                showToast('注册失败，请检查网络后重试');
            }
        }

        async function handleLogin() {
            const phone = document.getElementById('auth-phone').value.trim();
            const pwd = document.getElementById('auth-pwd').value.trim();
            if (!phone || !pwd) return showToast('请输入账号和密码');

            showToast('正在安全连接云数据库...');

            const user = await cloudGet(`user_${phone}`);
            if (!user) return showToast('用户不存在，请先注册');
            
            if (user.pwdHash !== simpleHash(pwd)) {
                return showToast('密码错误，请重新输入');
            }

            currentUser = user;
            localStorage.setItem('wx_current_user', phone);
            
            // 登录成功后渲染
            document.getElementById('auth-view').classList.add('translate-x-full');
            document.getElementById('app-view').classList.remove('hidden');
            
            loadMePage();
            loadChatsTab();
            loadContactsTab();
            initPeerJS(); // 接入通话信号服务
            
            showToast('登录成功');
            syncDataLoop(); // 开启远程轮询同步
        }

        function handleLogout() {
            localStorage.removeItem('wx_current_user');
            currentUser = null;
            if (peer) {
                peer.destroy();
                peer = null;
            }
            document.getElementById('auth-view').classList.remove('translate-x-full');
            document.getElementById('app-view').classList.add('hidden');
        }

            const saved = localStorage.getItem('wx_current_user');

        // ================= 发现、朋友圈模块 =================

        async function loadMoments() {

                    commentSection = `

                    <div class="flex-grow space-y-1">

                        ${commentSection}

                container.appendChild(card);

            lucide.createIcons();

        function openPublishMomentModal() {
            document.getElementById('publish-moment-modal').classList.remove('hidden');
        }
        function closePublishMomentModal() {
            document.getElementById('publish-moment-modal').classList.add('hidden');
            document.getElementById('moment-text-input').value = '';
        }
        async function submitPublishMoment() {
            const text = document.getElementById('moment-text-input').value.trim();
            if (!text) return showToast('请输入内容');

            showToast('正在上传动态...');
            let list = await cloudGet('moments');
            if (!list) list = [];

            const newMoment = {
                id: 'mom_' + Date.now(),
                phone: currentUser.phone,
                name: currentUser.name,
                text: text,
                timestamp: Date.now(),
                likes: [],
                comments: []
            };

            list.unshift(newMoment);
            await cloudSet('moments', list);

            loadMoments();
        }

        async function likeMoment(id) {
            let list = await cloudGet('moments');
            const item = list.find(m => m.id === id);
            if (item) {
                const idx = item.likes.indexOf(currentUser.phone);
                if (idx > -1) item.likes.splice(idx, 1);
                else item.likes.push(currentUser.phone);
                await cloudSet('moments', list);
                loadMoments();
            }
        }

        async function commentMoment(id) {
            const text = prompt("请输入评论内容：");
            if (!text || !text.trim()) return;

            let list = await cloudGet('moments');
            const item = list.find(m => m.id === id);
            if (item) {
                if (!item.comments) item.comments = [];
                item.comments.push({
                    name: currentUser.name,
                    text: text.trim()
                });
                await cloudSet('moments', list);
                loadMoments();
            }
        }

        // ================= 消息 & 跨设备实时对聊 =================
        async function getChatList() {
            const messages = await cloudGet(`msgs_${currentUser.phone}`) || [];
            const groups = await cloudGet('groups') || [];
            const chats = {};

            messages.forEach(msg => {
                const partner = msg.sender === currentUser.phone ? msg.receiver : msg.sender;
                if (!chats[partner]) {
                    chats[partner] = { id: partner, name: msg.senderName, lastText: '', time: msg.time, unread: 0 };
                }
                chats[partner].lastText = msg.content;
                chats[partner].time = msg.time;
            });

            // 内置官方客服机器人助手
            if (!chats['13800000001']) {
                chats['13800000001'] = { id: '13800000001', name: 'AndrewChat客服助手', lastText: '欢迎使用AndrewChat！可以和我聊天、发红包哟', time: Date.now() };
            }

            return Object.values(chats).sort((a,b) => b.time - a.time);
        }

        async function loadChatsTab() {
            const container = document.getElementById('tab-chats');
            const list = await getChatList();
            container.innerHTML = '';

            list.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center space-x-3 p-3 bg-white border-b border-gray-50 cursor-pointer hover:bg-gray-50";

                div.innerHTML = `

                    </div>

                        <div class="flex justify-between items-center">
                            <span class="text-sm font-semibold text-gray-800">${item.name}</span>
                            <span class="text-[10px] text-gray-400">${new Date(item.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1 truncate max-w-[200px]">${item.lastText}</p>

        function openChatWindow(sessionId, groupMode = false) {
            activeChatSession = sessionId;
            isGroupChat = groupMode;
            document.getElementById('chat-window').classList.remove('hidden');
            loadMessages();
        }

        async function loadMessages() {
            if (!activeChatSession) return;
            const container = document.getElementById('chat-messages');
            
            let allMsgs = await cloudGet(`msgs_${currentUser.phone}`) || [];
            
            // 过滤与当前会话对象的消息
            const currentMsgs = allMsgs.filter(m => 
                (m.sender === currentUser.phone && m.receiver === activeChatSession) || 
                (m.sender === activeChatSession && m.receiver === currentUser.phone)
            );

            container.innerHTML = '';

            if (activeChatSession === '13800000001' && currentMsgs.length === 0) {
                // 如果是新号，渲染官方欢迎气泡
                container.innerHTML = `
                    <div class="flex justify-start items-start space-x-2">
                        <div class="w-8 h-8 rounded bg-emerald-600 flex items-center justify-center text-white font-semibold text-xs shrink-0">助</div>

                            欢迎来到全新的 AndrewChat，我们通过 WebRTC 技术支持了跨设备的视频通话呼叫，以及通过无感云端接口实现了完美的云端备份和跨设备同步！
                        </div>
                    </div>
                `;
            }

            currentMsgs.forEach(msg => {

                const avatar = `<div class="w-8 h-8 rounded bg-emerald-500 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">${msg.senderName.charAt(0)}</div>`;

                let body = '';

                    body = `
                        <div onclick="openRedPacketOverlay('${msg.id}')" class="bg-amber-500 hover:bg-amber-600 rounded-xl p-3 text-white flex items-center space-x-3 cursor-pointer shadow-md w-52">

                                <i data-lucide="gift" class="w-6 h-6"></i>
                            </div>
                            <div class="flex-grow">
                                <h4 class="text-xs font-semibold">${msg.content}</h4>
                                <span class="text-[9px] text-amber-100">微信红包</span>
                            </div>
                        </div>
                    `;
                } else {
                    body = `
                        <div class="relative ${isMe ? 'bg-[#95ec69] text-gray-800 bubble-me' : 'bg-white text-gray-800 bubble-other'} rounded-lg p-2.5 text-sm max-w-[240px] shadow-sm break-words">
                            ${msg.content}
                        </div>
                    `;

                div.innerHTML = isMe ? `${body}${avatar}` : `${avatar}<div><span class="text-[9px] text-gray-400 block mb-0.5">${msg.senderName}</span>${body}</div>`;

        async function sendTextMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeChatSession) return;

            const newMsg = {
                id: 'msg_' + Date.now(),
                sender: currentUser.phone,
                senderName: currentUser.name,
                receiver: activeChatSession,
                type: 'text',
                content: text,
                time: Date.now()
            };

            // 存入我的云端和对方的云端（消息双路对称分发存储，完美解决数据持久性）
            let myMsgs = await cloudGet(`msgs_${currentUser.phone}`) || [];
            myMsgs.push(newMsg);
            await cloudSet(`msgs_${currentUser.phone}`, myMsgs);

            if (activeChatSession !== '13800000001') {
                let otherMsgs = await cloudGet(`msgs_${activeChatSession}`) || [];
                otherMsgs.push(newMsg);
                await cloudSet(`msgs_${activeChatSession}`, otherMsgs);
            }

            input.value = '';
            playSound('message');
            loadMessages();

            // 如果对方在线，同时通过 WebRTC 发送一条实时包通知
            if (peer && activeChatSession !== '13800000001') {
                const conn = peer.connect(`andrewchat_${activeChatSession}`);
                conn.on('open', () => {
                    conn.send({ type: 'text-msg', sender: currentUser.phone });
                });
            }

            // 机器人反馈
            if (activeChatSession === '13800000001') {
                triggerBotResponse(text);
            }
        }

        function triggerBotResponse(text) {
            setTimeout(async () => {
                let ans = "小安收到！您的跨设备云端 AndrewChat 已全部畅通，您现在可以让您的伙伴在手机或者其他电脑上输入网址开始畅聊并拨打真实的视频电话了！";
                if (text.includes("你好")) ans = "您好！我是您的 AndrewChat 智能助手，竭诚为您服务。";
                if (text.includes("红包")) ans = "谢谢您的红包，如果是测试，您包一个红包我可以帮您秒抢哟。";

                const reply = {
                    id: 'msg_' + Date.now(),
                    sender: '13800000001',
                    senderName: 'AndrewChat客服助手',
                    receiver: currentUser.phone,
                    type: 'text',
                    content: ans,
                    time: Date.now()
                };

                let myMsgs = await cloudGet(`msgs_${currentUser.phone}`) || [];
                myMsgs.push(reply);
                await cloudSet(`msgs_${currentUser.phone}`, myMsgs);
                playSound('message');
                loadMessages();
            }, 1000);
        }

        function toggleChatPanel() {
            document.getElementById('chat-panel').classList.toggle('hidden');
        }

        // ================= 添加朋友与建群 =================
        function openAddFriendModal() { document.getElementById('add-friend-modal').classList.remove('hidden'); }
        function closeAddFriendModal() { document.getElementById('add-friend-modal').classList.add('hidden'); }
        async function submitAddFriend() {
            const phone = document.getElementById('search-phone').value.trim();
            if (!phone) return;
            if (phone === currentUser.phone) return showToast('不能添加自己');

            showToast('正在寻找用户...');
            const target = await cloudGet(`user_${phone}`);
            if (!target) return showToast('未找到该手机号用户');

            if (!currentUser.friends) currentUser.friends = [];
            if (currentUser.friends.includes(phone)) return showToast('已经是好友了');

            currentUser.friends.push(phone);
            await cloudSet(`user_${currentUser.phone}`, currentUser);

            // 对方也默认同步添加我
            if (!target.friends) target.friends = [];
            if (!target.friends.includes(currentUser.phone)) {
                target.friends.push(currentUser.phone);
                await cloudSet(`user_${phone}`, target);
            }

            closeAddFriendModal();
            loadContactsTab();
            showToast('好友添加成功');
        }

        async function loadContactsTab() {
            const cList = document.getElementById('contact-list');
            cList.innerHTML = '<div class="p-4 text-center text-gray-400 text-xs">正在载入好友...</div>';
            
            if (!currentUser.friends) currentUser.friends = [];
            cList.innerHTML = '';

            for (let fPhone of currentUser.friends) {
                const fUser = await cloudGet(`user_${fPhone}`) || { name: `好友_${fPhone.slice(-4)}`, phone: fPhone };
                const div = document.createElement('div');
                div.className = "flex items-center space-x-3 p-3 bg-white border-b border-gray-50 cursor-pointer hover:bg-gray-50";
                div.onclick = () => openChatWindow(fPhone, false);
                div.innerHTML = `
                    <div class="w-9 h-9 bg-[#07c160]/10 border border-emerald-500/10 text-emerald-600 rounded-lg flex items-center justify-center font-bold text-xs shadow-sm">
                        ${fUser.name.charAt(0)}
                    </div>
                    <span class="text-sm font-semibold text-gray-800">${fUser.name}</span>
                `;
                cList.appendChild(div);
            }
        }

        function openCreateGroupModal() {}
        function closeCreateGroupModal() {}
        function submitCreateGroup() {}

        // ================= 红包模块 =================
        let activeRpId = null;
        function openSendRedPacketModal() {
            document.getElementById('send-redpacket-modal').classList.remove('hidden');
            document.getElementById('rp-amount').value = '';
            document.getElementById('rp-total-display').innerText = '¥ 0.00';
            document.getElementById('rp-amount').oninput = (e) => {
                const val = parseFloat(e.target.value) || 0;
                document.getElementById('rp-total-display').innerText = '¥ ' + val.toFixed(2);
            };
        }
        function closeSendRedPacketModal() {
            document.getElementById('send-redpacket-modal').classList.add('hidden');
        }

        async function submitSendRedPacket() {
            const amount = parseFloat(document.getElementById('rp-amount').value);
            const count = parseInt(document.getElementById('rp-count').value) || 1;
            const desc = document.getElementById('rp-desc').value.trim() || '恭喜发财，大吉大利';

            if (isNaN(amount) || amount <= 0) return showToast('请输入正确的金额');
            if (currentUser.balance < amount) return showToast('模拟币余额不足，请去“我”充值');

            currentUser.balance = Number(currentUser.balance) - amount;
            await cloudSet(`user_${currentUser.phone}`, currentUser);
            loadMePage();

            const rpId = 'rp_' + Date.now();
            const newMsg = {
                id: 'msg_' + Date.now(),
                sender: currentUser.phone,
                senderName: currentUser.name,
                receiver: activeChatSession,
                type: 'redpacket',
                content: desc,
                time: Date.now(),
                extra: {
                    rpId: rpId,
                    totalAmount: amount,
                    remainAmount: amount,
                    openedBy: []
                }
            };

            let myMsgs = await cloudGet(`msgs_${currentUser.phone}`) || [];
            myMsgs.push(newMsg);
            await cloudSet(`msgs_${currentUser.phone}`, myMsgs);

            if (activeChatSession !== '13800000001') {
                let otherMsgs = await cloudGet(`msgs_${activeChatSession}`) || [];
                otherMsgs.push(newMsg);
                await cloudSet(`msgs_${activeChatSession}`, otherMsgs);
            }

            closeSendRedPacketModal();
            toggleChatPanel();
            loadMessages();
            showToast('红包已发出！');
        }

        async function openRedPacketOverlay(msgId) {
            activeRpId = msgId;
            let myMsgs = await cloudGet(`msgs_${currentUser.phone}`) || [];
            const msg = myMsgs.find(m => m.id === msgId);
            if (!msg || !msg.extra) return;

            document.getElementById('rp-sender-name').innerText = msg.senderName + ' 的红包';
            document.getElementById('rp-sender-desc').innerText = msg.content;
            document.getElementById('rp-sender-avatar').innerText = msg.senderName.charAt(0);

            const alreadyOpened = msg.extra.openedBy.includes(currentUser.phone);
            const openBtn = document.getElementById('rp-open-btn');
            const detailView = document.getElementById('rp-detail-view');

            if (alreadyOpened) {
                // 如果抢过，直接显示
                document.getElementById('rp-detail-amount').innerText = '¥ ' + Number(msg.extra.totalAmount).toFixed(2);
                openBtn.classList.add('hidden');
                detailView.classList.remove('hidden');
            } else {
                openBtn.classList.remove('hidden');
                detailView.classList.add('hidden');
                openBtn.onclick = () => performOpenRedPacket(msgId);
            }

            document.getElementById('open-redpacket-overlay').classList.remove('hidden');
        }

        function closeOpenRedPacketOverlay() {
            document.getElementById('open-redpacket-overlay').classList.add('hidden');
            document.getElementById('rp-open-btn').classList.remove('animate-spin-coin');
            activeRpId = null;
        }

        async function performOpenRedPacket(msgId) {
            const openBtn = document.getElementById('rp-open-btn');
            openBtn.classList.add('animate-spin-coin');

            setTimeout(async () => {
                let myMsgs = await cloudGet(`msgs_${currentUser.phone}`) || [];
                const msg = myMsgs.find(m => m.id === msgId);
                if (!msg || !msg.extra) return;

                if (msg.extra.openedBy.includes(currentUser.phone)) {
                    showToast('您已经领取过此红包了');
                    return;
                }

                // 计算领取的红包金额并增加到余额
                const grabAmount = msg.extra.totalAmount;
                msg.extra.openedBy.push(currentUser.phone);
                
                await cloudSet(`msgs_${currentUser.phone}`, myMsgs);

                currentUser.balance = Number(currentUser.balance) + grabAmount;
                await cloudSet(`user_${currentUser.phone}`, currentUser);

                playSound('coin');

                openBtn.classList.add('hidden');
                document.getElementById('rp-detail-amount').innerText = '¥ ' + grabAmount.toFixed(2);
                document.getElementById('rp-detail-view').classList.remove('hidden');

                loadMePage();
                loadMessages();
            }, 1200);
        }

        // ================= 跨设备真实 WebRTC 视频通话 P2P 通信 =================
        async function startVideoCall() {
            if (!peer) return showToast('通信信号机未准备完毕，请检查网络');
            
            showToast('正在向对方发起视频通话呼叫...');
            playSound('ringtone-start');
            
            document.getElementById('video-caller-name').innerText = activeChatSession;
            document.getElementById('video-call-status').innerText = '正在呼叫对方连接...';
            document.getElementById('video-call-overlay').classList.remove('hidden');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                
                // 拨通 P2P 呼叫
                const call = peer.call(`andrewchat_${activeChatSession}`, localStream);
                activeCall = call;

                call.on('stream', (remoteStream) => {
                    playSound('ringtone-stop');
                    document.getElementById('video-call-status').innerText = '通话中';
                    const rVideo = document.getElementById('remote-video');
                    rVideo.srcObject = remoteStream;
                    rVideo.classList.remove('hidden');
                    document.getElementById('remote-video-placeholder').classList.add('hidden');
                });
            } catch (e) {
                console.error("No Camera Permission:", e);
                showToast('无法启动本地摄像头，请授予权限');
                hangupVideoCall();
            }
        }

        async function acceptVideoCall() {
            if (!activeCall) return;
            playSound('ringtone-stop');
            document.getElementById('video-accept-btn').classList.add('hidden');
            document.getElementById('video-call-status').innerText = '正在连接画面...';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                
                activeCall.answer(localStream); // 应答并将本地视频流传过去
                activeCall.on('stream', (remoteStream) => {
                    document.getElementById('video-call-status').innerText = '通话中';
                    const rVideo = document.getElementById('remote-video');
                    rVideo.srcObject = remoteStream;
                    rVideo.classList.remove('hidden');
                    document.getElementById('remote-video-placeholder').classList.add('hidden');
                });
            } catch (e) {
                console.error("Camera Access Fail:", e);
                hangupVideoCall();
            }
        }

        function hangupVideoCall() {
            playSound('ringtone-stop');
            if (activeCall) {
                activeCall.close();
                activeCall = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('local-video').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('remote-video').classList.add('hidden');
            document.getElementById('remote-video-placeholder').classList.remove('hidden');
            document.getElementById('video-call-overlay').classList.add('hidden');
            document.getElementById('video-accept-btn').classList.add('hidden');
            showToast('通话已挂断');
        }

        // ================= 发现页与主导航 Tab 选项切换 =================
        let activeTab = 'chats';
        function switchTab(tabId) {
            activeTab = tabId;
            const tabs = ['chats', 'contacts', 'discover', 'me'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('text-emerald-500');
                document.getElementById(`nav-${t}`).classList.add('text-gray-400');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('text-emerald-500');
            document.getElementById(`nav-${tabId}`).classList.remove('text-gray-400');
            
            if (tabId === 'chats') loadChatsTab();
            if (tabId === 'contacts') loadContactsTab();
            if (tabId === 'me') loadMePage();
            
            const titleMap = { 'chats': 'AndrewChat', 'contacts': '通讯录', 'discover': '发现', 'me': '我' };
            document.getElementById('header-title').innerText = titleMap[tabId];
        }

        // ================= 跨设备实时云轮询同步协程 (云端直连) =================
        let lastSyncTime = Date.now();
        function syncDataLoop() {
            setInterval(async () => {
                if (!currentUser) return;

                // 异步获取我的云端消息队列，进行轻量对比重绘
                const remoteMsgs = await cloudGet(`msgs_${currentUser.phone}`) || [];
                const localMsgs = JSON.parse(localStorage.getItem(`local_msgs_${currentUser.phone}`)) || [];
                
                if (remoteMsgs.length !== localMsgs.length) {
                    localStorage.setItem(`local_msgs_${currentUser.phone}`, JSON.stringify(remoteMsgs));
                    if (activeChatSession) loadMessages();
                    else loadChatsTab();
                    
                    // 新消息通知
                    if (remoteMsgs.length > localMsgs.length) {
                        const newMsg = remoteMsgs[remoteMsgs.length - 1];
                        if (newMsg.sender !== currentUser.phone) {
                            playSound('message');
                        }
                    }
                }
                
                // 朋友圈红点提示轮询
                const remoteMoments = await cloudGet('moments') || [];
                const localMoments = JSON.parse(localStorage.getItem('local_moments')) || [];
                if (remoteMoments.length !== localMoments.length) {
                    localStorage.setItem('local_moments', JSON.stringify(remoteMoments));
                    if (activeTab !== 'discover') {
                        document.getElementById('moments-badge').classList.remove('hidden');
                    }
                }
            }, 3000); // 3 秒轮询同步一次
        }

        // 默认初始化
        checkLoginState();
    </script>
